<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090f">
<title>Huddle — room</title>
<style>
  :root { --ink:#f2f5fa; --dim:#8d97ab; --line:#222a3a; --hot:#ff5a4e; --hold:#ffc857; --ok:#3dd68c; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; background:#07090f; color:var(--ink);
    font:600 16px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display:grid; grid-template-rows:auto 1fr auto; min-height:100dvh; overflow:hidden; }
  header, footer { display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:12px 20px; border-bottom:1px solid var(--line); }
  footer { border-bottom:0; border-top:1px solid var(--line); flex-wrap:wrap; }
  .brand { letter-spacing:.22em; text-transform:uppercase; font-size:12px; font-weight:800; color:var(--dim); }
  .brand b { color:var(--ink); letter-spacing:.18em; }
  .mode { font-size:13px; letter-spacing:.14em; text-transform:uppercase; }
  .mode .live { color:var(--hot); }
  .mode .lobby { color:var(--ok); }
  .stage { display:grid; grid-template-columns:1fr min(32vw, 340px); min-height:0; }
  canvas { width:100%; height:100%; display:block; }
  aside { border-left:1px solid var(--line); padding:18px 18px 12px; display:flex; flex-direction:column;
    align-items:center; gap:10px; min-height:0; overflow:auto; }
  #qr { padding:10px; background:#fff; border-radius:12px; }
  #qr img, #qr canvas { display:block; }
  .url { font-size:13px; font-weight:700; word-break:break-all; text-align:center; color:var(--ink);
    max-width:28ch; }
  .hint { font-size:12px; font-weight:500; color:var(--dim); text-align:center; max-width:28ch; }
  .players { width:100%; margin-top:8px; display:flex; flex-direction:column; gap:6px; }
  .players span { display:flex; justify-content:space-between; font-size:13px; letter-spacing:.06em;
    text-transform:uppercase; padding:6px 8px; border:1px solid var(--line); border-radius:8px; }
  .players .out { opacity:.4; text-decoration:line-through; }
  .players .hold { border-color:var(--hot); color:var(--hot); }
  .tick { font-variant-numeric:tabular-nums; letter-spacing:.08em; text-transform:uppercase;
    font-size:13px; color:var(--dim); display:flex; gap:22px; flex-wrap:wrap; }
  .tick b { color:var(--ink); font-size:18px; letter-spacing:0; }
  .caption { color:var(--dim); font-size:13px; font-weight:500; }
  #boom { position:fixed; inset:0; display:grid; place-items:center; pointer-events:none;
    background:rgba(7,9,15,.72); opacity:0; transition:opacity .12s linear; z-index:5; }
  #boom.on { opacity:1; }
  #boom .big { font-size:clamp(42px, 8vw, 96px); font-weight:800; letter-spacing:-.03em; text-align:center; }
  #boom .sub { text-align:center; letter-spacing:.16em; text-transform:uppercase; color:var(--dim); margin-top:8px; }
  .warn { position:fixed; top:10px; left:50%; transform:translateX(-50%); background:#3a2a10; color:var(--hold);
    padding:6px 14px; border-radius:999px; font-size:12px; font-weight:700; letter-spacing:.08em; z-index:6; }
  @media (max-width: 820px) {
    body { overflow:auto; }
    .stage { grid-template-columns:1fr; grid-template-rows:auto 1fr; }
    aside { border-left:0; border-bottom:1px solid var(--line); flex-direction:row; flex-wrap:wrap;
      justify-content:center; }
    canvas { min-height:62vw; }
  }
  @media (prefers-reduced-motion:reduce) { #boom { transition:none; } }
</style>

<header>
  <div class="brand"><b>Huddle</b> · director</div>
  <div class="mode" id="mode">waiting for the room</div>
</header>
<div class="stage">
  <canvas id="c"></canvas>
  <aside>
    <div id="qr"></div>
    <div class="url" id="join"></div>
    <div class="hint">Scan to join. One link, no install. This screen sees the truth the phones cannot.</div>
    <div class="players" id="plist"></div>
  </aside>
</div>
<footer>
  <div class="tick" id="tick">
    <span><b id="n-rounds">0</b> rounds</span>
    <span><b id="n-people">0</b> people</span>
    <span><b id="n-fast">—</b> fastest</span>
  </div>
  <div class="caption" id="cap"></div>
  <div class="caption" id="seatnotice" hidden style="color:#ffc857;font-weight:800"></div>
</footer>
<div id="boom"><div><div class="big" id="boom-big"></div><div class="sub" id="boom-sub">out</div></div></div>

<script src="/qrcode.min.js"></script>
<script type="module">
const JOIN = new URLSearchParams(location.search).get("url") || location.origin;
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const proto = location.protocol === "https:" ? "wss" : "ws";

let ws = null, S = null, offset = 0, lastPong = Date.now(), dropped = false;
const offsets = [];
const serverNow = () => Date.now() + offset;
const ping = () => ws?.readyState === 1 && ws.send(JSON.stringify({ t: "ping", c: Date.now() }));

function onPong(m) {
  lastPong = Date.now();
  offsets.push(m.s - (m.c + (Date.now() - m.c) / 2));
  offsets.sort((a, b) => a - b);
  offset = offsets[offsets.length >> 1];
  if (offsets.length > 24) offsets.shift();
}

function connect() {
  ws = new WebSocket(`${proto}://${location.host}?spectate=${new URLSearchParams(location.search).get('key') || ''}`);
  ws.onopen = () => {
    dropped = false; lastPong = Date.now();
    for (let i = 0; i < 5; i++) setTimeout(ping, i * 110);
    document.querySelector(".warn")?.remove();
  };
  ws.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    if (m.t === "pong") return onPong(m);
    if (m.t === "view") { onView(m); }
  };
  ws.onclose = () => {
    dropped = true;
    if (!document.querySelector(".warn")) {
      const w = document.createElement("div");
      w.className = "warn"; w.textContent = "RECONNECTING";
      document.body.append(w);
    }
    setTimeout(connect, 700);
  };
  ws.onerror = () => ws.close();
}
setInterval(() => {
  ping();
  if (Date.now() - lastPong > 9000 && ws?.readyState === 1) ws.close();
}, 3000);
connect();

document.getElementById("join").textContent = JOIN.replace(/^https?:\/\//, "");
new QRCode(document.getElementById("qr"), {
  text: JOIN,
  width: 220,
  height: 220,
  colorDark: "#07090f",
  colorLight: "#ffffff",
  correctLevel: QRCode.CorrectLevel.M,
});

let lastHolder = null, lastNotice = "", boomUntil = 0, fuseSpan = 20000, fuseEnd = 0;
const localTicker = { rounds: 0, people: new Set(), bestReactionMs: null };
let lastPhase = null;

function onView(m) {
  const map = m.view?.map;
  if (map?.holder != null) lastHolder = map.holder;
  if (m.view?.countdownTo && m.view.countdownTo !== fuseEnd) {
    fuseEnd = m.view.countdownTo;
    fuseSpan = Math.max(3000, fuseEnd - serverNow());
  }
  if (m.notice && m.notice !== lastNotice && (m.phase === "gap" || m.phase === "over")) {
    lastNotice = m.notice;
    boomUntil = Date.now() + 2000;
    document.getElementById("boom-big").textContent = m.notice;
    document.getElementById("boom").classList.add("on");
    setTimeout(() => { if (Date.now() >= boomUntil - 20) document.getElementById("boom").classList.remove("on"); }, 2000);
  }
  if (m.phase === "over" && lastPhase && lastPhase !== "over") {
    localTicker.rounds += 1;
    const times = String(m.view?.sub || "").match(/(\d+)ms/g);
    if (times) {
      for (const t of times) {
        const n = parseInt(t, 10);
        if (!localTicker.bestReactionMs || n < localTicker.bestReactionMs) localTicker.bestReactionMs = n;
      }
    }
  }
  lastPhase = m.phase;
  for (const p of m.players || []) localTicker.people.add(p.name);
  S = m;
  paintChrome();
}

function paintChrome() {
  if (!S) return;
  const live = S.phase === "live";
  document.getElementById("mode").innerHTML =
    `<span class="${live ? "live" : "lobby"}">${S.phase}</span> · ${S.modeName || ""}`;
  document.getElementById("cap").textContent = [S.view?.title, S.view?.sub].filter(Boolean).join(" — ");
  const t = S.ticker || {
    rounds: localTicker.rounds,
    people: localTicker.people.size,
    bestReactionMs: localTicker.bestReactionMs,
  };
  document.getElementById("n-rounds").textContent = t.rounds;
  document.getElementById("n-people").textContent = t.people;
  document.getElementById("n-fast").textContent = t.bestReactionMs != null ? `${t.bestReactionMs}ms` : "—";
  const holder = S.view?.map?.holder;
  const list = document.getElementById("plist");
  const noticeEl = document.getElementById("seatnotice");
  const notice = S.view?.seatNotice;
  if (noticeEl) { noticeEl.textContent = notice || ""; noticeEl.hidden = !notice; }
  list.innerHTML = (S.players || []).map((p) =>
    `<span class="${p.alive ? (p.id === holder ? "hold" : "") : "out"}"><b>${esc(p.name)}</b><i>${p.alive ? (p.id === holder ? "has it" : (p.score || "")) : "out"}</i></span>`
  ).join("");
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const r = canvas.getBoundingClientRect();
  canvas.width = Math.max(1, Math.floor(r.width * dpr));
  canvas.height = Math.max(1, Math.floor(r.height * dpr));
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener("resize", resize);
resize();

function pos(angle, cx, cy, r) {
  return { x: cx + Math.cos(angle) * r, y: cy + Math.sin(angle) * r };
}

function draw() {
  const w = canvas.getBoundingClientRect().width;
  const h = canvas.getBoundingClientRect().height;
  ctx.clearRect(0, 0, w, h);

  const cx = w / 2, cy = h / 2;
  const r = Math.min(w, h) * 0.34;
  const v = S?.view || {};
  const map = v.map || {};
  const players = (map.players && map.players.length)
    ? map.players
    : (S?.players || []).map((p) => ({ id: p.id, name: p.name, angle: p.seat, alive: p.alive }));

  // table
  ctx.beginPath();
  ctx.arc(cx, cy, r + 28, 0, Math.PI * 2);
  ctx.fillStyle = "#101624";
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = "#2a3348";
  ctx.stroke();

  // fuse ring — shrinking toward the table as the shared clock burns down
  if (v.countdownTo && S?.phase === "live") {
    const left = Math.max(0, v.countdownTo - serverNow());
    const t = Math.max(0, Math.min(1, left / fuseSpan));
    ctx.beginPath();
    ctx.arc(cx, cy, r + 40, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * t);
    ctx.strokeStyle = t > 0.28 ? "#3dd68c" : "#ff5a4e";
    ctx.lineWidth = 6;
    ctx.lineCap = "round";
    ctx.stroke();
    ctx.lineCap = "butt";
    ctx.fillStyle = "#f2f5fa";
    ctx.font = "800 42px ui-sans-serif, system-ui";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText((left / 1000).toFixed(1), cx, cy - 8);
    ctx.font = "700 11px ui-sans-serif, system-ui";
    ctx.fillStyle = "#8d97ab";
    ctx.fillText("FUSE", cx, cy + 22);
  }

  // Flash: the whole table goes white on the shared clock
  if (v.flashAt && S?.phase === "live") {
    const lit = serverNow() >= v.flashAt;
    if (!lit) {
      const left = Math.max(0, v.flashAt - serverNow());
      ctx.fillStyle = "#8d97ab";
      ctx.font = "700 18px ui-sans-serif, system-ui";
      ctx.textAlign = "center";
      ctx.fillText("wait for it", cx, cy);
      ctx.fillStyle = "#3a4254";
      ctx.font = "600 13px ui-sans-serif, system-ui";
      ctx.fillText((left / 1000).toFixed(2) + "s", cx, cy + 24);
    } else {
      ctx.beginPath();
      ctx.arc(cx, cy, r + 28, 0, Math.PI * 2);
      ctx.fillStyle = "#eef4ff";
      ctx.fill();
      ctx.fillStyle = "#0a0d14";
      ctx.font = "800 64px ui-sans-serif, system-ui";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(v.litBig || "GO", cx, cy);
    }
  }

  // Modes with no countdown and no flash (Relay, Chain, Wiretap, Duel) still have something to
  // say in the middle of the table. Without this the room screen went blank for four of seven games.
  if (S?.phase === "live" && !v.countdownTo && !v.flashAt) {
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    if (v.big != null) {
      ctx.fillStyle = "#f2f5fa";
      ctx.font = "800 44px ui-sans-serif, system-ui";
      ctx.fillText(String(v.big), cx, cy - 8);
    }
    if (v.title) {
      ctx.fillStyle = "#8d97ab";
      ctx.font = "700 13px ui-sans-serif, system-ui";
      ctx.fillText(String(v.title).toUpperCase(), cx, cy + (v.big != null ? 26 : 0));
    }
  }

  if (S?.phase === "lobby" || S?.phase === "over") {
    ctx.fillStyle = "#f2f5fa";
    ctx.font = "800 36px ui-sans-serif, system-ui";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(v.big || (S.phase === "over" ? (S.winner || "nobody") : "HUDDLE"), cx, cy - 6);
    ctx.fillStyle = "#8d97ab";
    ctx.font = "600 13px ui-sans-serif, system-ui";
    ctx.fillText(v.title || S?.modeName || "", cx, cy + 26);
  }

  if (S?.phase === "gap") {
    ctx.fillStyle = "#ffc857";
    ctx.font = "800 28px ui-sans-serif, system-ui";
    ctx.textAlign = "center";
    ctx.fillText(S.notice || "next round", cx, cy);
  }

  const byId = new Map(players.map((p) => [p.id, p]));
  const flight = map.flight;
  let charge = null;
  if (flight && lastHolder != null) {
    const from = byId.get(lastHolder);
    const to = byId.get(flight.to);
    if (from && to) {
      const p = 1 - Math.max(0, Math.min(1, (flight.arriveAt - serverNow()) / 700));
      const a = pos(from.angle, cx, cy, r);
      const b = pos(to.angle, cx, cy, r);
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      const lift = 0.22 * r;
      const qx = mx + (cx - mx) * -0.15;
      const qy = my - lift;
      const x = (1 - p) * (1 - p) * a.x + 2 * (1 - p) * p * qx + p * p * b.x;
      const y = (1 - p) * (1 - p) * a.y + 2 * (1 - p) * p * qy + p * p * b.y;
      charge = { x, y, air: true };
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.quadraticCurveTo(qx, qy, b.x, b.y);
      ctx.strokeStyle = "rgba(255,200,87,.45)";
      ctx.lineWidth = 3;
      ctx.setLineDash([6, 8]);
      ctx.stroke();
      ctx.setLineDash([]);
    }
  } else if (map.holder != null) {
    const hold = byId.get(map.holder);
    if (hold) charge = { ...pos(hold.angle, cx, cy, r), air: false };
  }

  for (const p of players) {
    const pt = pos(p.angle, cx, cy, r);
    const alive = p.alive !== false;
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, 16, 0, Math.PI * 2);
    ctx.fillStyle = !alive ? "#2a3142" : (p.id === map.holder ? "#ff5a4e" : "#dce3f0");
    ctx.fill();
    if (p.id === map.holder) {
      ctx.strokeStyle = "rgba(255,90,78,.55)";
      ctx.lineWidth = 10;
      ctx.stroke();
    }
    const label = pos(p.angle, cx, cy, r + 56);
    ctx.fillStyle = alive ? "#f2f5fa" : "#5a6478";
    ctx.font = "800 13px ui-sans-serif, system-ui";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText((p.name || "?").toUpperCase(), label.x, label.y);
  }

  if (charge) {
    ctx.beginPath();
    ctx.arc(charge.x, charge.y, charge.air ? 14 : 11, 0, Math.PI * 2);
    ctx.fillStyle = charge.air ? "#ffc857" : "#ff5a4e";
    ctx.shadowColor = charge.air ? "#ffc857" : "#ff5a4e";
    ctx.shadowBlur = 18;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

if ("wakeLock" in navigator) {
  const hold = () => navigator.wakeLock.request("screen").catch(() => {});
  hold();
  addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") hold(); });
}
</script>

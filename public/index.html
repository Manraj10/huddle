<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a0d14">
<title>Huddle</title>
<style>
  :root { --ink:#f2f5fa; --dim:#8d97ab; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; margin:0; overscroll-behavior:none; touch-action:manipulation; }
  body { background:#0a0d14; color:var(--ink); user-select:none;
         font:600 17px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
  #app { position:fixed; inset:0; display:grid; place-items:center; padding:24px; text-align:center;
         transition:background .12s linear; }
  .big { font-size:clamp(56px,22vw,150px); line-height:.95; font-weight:800; letter-spacing:-.03em; }
  .title { font-size:19px; letter-spacing:.18em; text-transform:uppercase; margin-top:10px; }
  .sub { font-size:15px; font-weight:500; color:var(--dim); margin:8px auto 0; max-width:34ch; }
  .dim .big, .dim .title { color:var(--dim); }
  .pulse { animation:p .62s infinite alternate ease-in-out; }
  @keyframes p { from { transform:scale(1); } to { transform:scale(1.07); } }
  @media (prefers-reduced-motion:reduce) { .pulse { animation:none; } }
  .ring { position:fixed; inset:0; pointer-events:none; }
  .ring b { position:absolute; transform:translate(-50%,-50%); font-size:13px; font-weight:800;
            letter-spacing:.08em; color:#aab4c8; text-transform:uppercase; }
  input { font:600 20px ui-sans-serif,system-ui,sans-serif; padding:15px; border-radius:14px;
          border:1px solid #2b3345; background:#141a26; color:var(--ink); width:min(78vw,320px); text-align:center; }
  button { font:700 17px ui-sans-serif,system-ui,sans-serif; padding:15px 26px; border-radius:14px; border:0;
           background:var(--ink); color:#0a0d14; margin:6px 4px 0; }
  button.ghost { background:#1a2130; color:var(--ink); border:1px solid #2b3345; }
  button.on { background:#ffc857; color:#1a1405; }
  .modes { display:grid; gap:8px; margin:14px auto 4px; width:min(88vw,420px); }
  .modes button { width:100%; text-align:left; padding:13px 16px; }
  .modes small { display:block; font-weight:500; font-size:13px; opacity:.7; margin-top:3px; }
  .scores { position:fixed; top:0; left:0; right:0; padding:10px 14px; display:flex; gap:12px;
            justify-content:center; flex-wrap:wrap; font-size:12px; font-weight:700; letter-spacing:.1em;
            text-transform:uppercase; color:#7d879b; }
  .scores i { font-style:normal; opacity:.45; }
  .scores .out { opacity:.35; text-decoration:line-through; }
  .notice { position:fixed; bottom:0; left:0; right:0; padding:14px; text-align:center;
            font-size:14px; font-weight:600; color:var(--dim); }
</style>

<div id="app"></div>
<div class="ring" id="ring"></div>
<div class="scores" id="scores"></div>
<div class="notice" id="notice"></div>

<script type="module">
const $ = (id) => document.getElementById(id);
const app = $("app"), ringEl = $("ring");
const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}`);

let me = null, S = null, offset = 0, ac = null, osc = null, gain = null, joined = false;
const offsets = [];

// Clock sync: five round trips, keep the median offset. Every timed game hangs off this.
const ping = () => ws.readyState === 1 && ws.send(JSON.stringify({ t: "ping", c: Date.now() }));
function onPong(m) {
  offsets.push(m.s - (m.c + (Date.now() - m.c) / 2));
  offsets.sort((a, b) => a - b);
  offset = offsets[offsets.length >> 1];
}

// One oscillator whose pitch follows whatever urgency the server sends.
function audioOn() {
  if (ac) return;
  ac = new (window.AudioContext || window.webkitAudioContext)();
  osc = ac.createOscillator(); gain = ac.createGain();
  gain.gain.value = 0; osc.type = "sawtooth"; osc.frequency.value = 120;
  osc.connect(gain); gain.connect(ac.destination); osc.start();
}
function tone(level) {
  if (!gain) return;
  gain.gain.setTargetAtTime(level > 0 ? 0.045 : 0, ac.currentTime, 0.07);
  if (level > 0) osc.frequency.setTargetAtTime(120 + level * 520, ac.currentTime, 0.12);
}
const buzz = (ms) => navigator.vibrate && navigator.vibrate(ms);

// A swipe is a direction (meaning a person). A tap is a tap. Games decide what those mean.
let down = null;
addEventListener("pointerdown", (e) => { down = { x: e.clientX, y: e.clientY }; });
addEventListener("pointerup", (e) => {
  if (!down || !joined) return;
  const dx = e.clientX - down.x, dy = e.clientY - down.y, far = Math.hypot(dx, dy) > 38;
  down = null;
  if (far) { ws.send(JSON.stringify({ t: "act", a: "swipe", angle: Math.atan2(dy, dx) })); buzz(18); }
  else ws.send(JSON.stringify({ t: "act", a: "tap" }));
});

ws.onopen = () => { for (let i = 0; i < 5; i++) setTimeout(ping, i * 110); render(); };
ws.onclose = () => { S = null; app.innerHTML = `<div><div class="title">disconnected</div><div class="sub">reload to rejoin</div></div>`; };
ws.onmessage = (ev) => {
  const m = JSON.parse(ev.data);
  if (m.t === "pong") return onPong(m);
  if (m.t === "hello") { me = m.id; joined = true; return; }
  if (m.t === "view") { S = m; render(); }
};

function drawRing(ring) {
  ringEl.innerHTML = "";
  if (!ring || !ring.length) return;
  const cx = innerWidth / 2, cy = innerHeight / 2, r = Math.min(cx, cy) * 0.8;
  for (const p of ring) {
    const b = document.createElement("b");
    b.textContent = p.name;
    b.style.left = `${cx + Math.cos(p.angle) * r}px`;
    b.style.top = `${cy + Math.sin(p.angle) * r}px`;
    ringEl.append(b);
  }
}

function render() {
  if (!S) {
    app.style.background = "#0a0d14";
    app.innerHTML = `<div><div class="big" style="font-size:46px">HUDDLE</div>
      <div class="sub">party games that live across everyone&rsquo;s phones</div>
      <div style="margin-top:18px"><input id="n" placeholder="your name" maxlength="12" autocomplete="off"></div>
      <button id="j">Join</button></div>`;
    $("j").onclick = () => { audioOn(); ws.send(JSON.stringify({ t: "join", name: $("n").value || "player" })); };
    $("n").onkeydown = (e) => { if (e.key === "Enter") $("j").click(); };
    return;
  }

  const v = S.view || {};
  app.style.background = v.bg || "#0a0d14";
  app.style.color = v.ink || "#f2f5fa";
  tone(v.tone || 0);

  $("scores").innerHTML = S.players.map((p) =>
    `<span class="${p.alive ? "" : "out"}">${p.name}${p.score ? ` <i>${p.score}</i>` : ""}</span>`).join("");
  $("notice").textContent = S.phase === "live" ? "" : (S.notice || "");

  if (v.lobby) {
    app.innerHTML = `<div><div class="title">${S.modeName}</div><div class="sub">${v.sub || ""}</div>
      <div class="modes" id="modes">${S.modes.map((m) =>
        `<button class="ghost${m.key === S.mode ? " on" : ""}" data-k="${m.key}">${m.name}
          <small>${m.blurb} &middot; ${m.min}+ players</small></button>`).join("")}</div>
      <button id="go">Start ${S.modeName}</button></div>`;
    for (const b of $("modes").children) b.onclick = () => ws.send(JSON.stringify({ t: "start", mode: b.dataset.k }));
    $("go").onclick = () => ws.send(JSON.stringify({ t: "start", mode: S.mode }));
    drawRing(null);
    return;
  }

  app.innerHTML = `<div class="${v.dim ? "dim" : ""}">
    ${v.big != null ? `<div class="big ${v.pulse ? "pulse" : ""}">${v.big}</div>` : ""}
    ${v.title ? `<div class="title">${v.title}</div>` : ""}
    ${v.sub ? `<div class="sub">${v.sub}</div>` : ""}</div>`;
  drawRing(v.ring);
}

setInterval(() => { if (S && S.phase === "live") render(); }, 90);   // countdowns move between messages
setInterval(ping, 4000);
addEventListener("resize", () => { if (S) render(); });

if ("wakeLock" in navigator) {
  const hold = () => navigator.wakeLock.request("screen").catch(() => {});
  hold();
  addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") hold(); });
}
</script>

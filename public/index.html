<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0c0b12">
<meta name="color-scheme" content="dark">
<title>Huddle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Source+Sans+3:wght@400;600&display=swap">

<style>
/* ============================================================================
   TOKENS. Nothing below this block invents a colour, a size or a duration.
   One full-screen palette per state, because the person holding this phone is
   looking at the other people in the room, not at the screen. State has to
   survive being read in a glance, at arm's length, off the light on a face.
   ========================================================================= */
:root {
  --display: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --text: "Source Sans 3", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;

  --ink: #f4f6fb;
  --dim: #989cb2;
  --line: #262234;
  --raise: #16131f;

  --idle: #0c0b12;              /* almost black, cool, biased a touch toward the accent */
  --hold-cold: 108, 38, 22;     /* the fuse at full length */
  --hold-hot: 255, 74, 32;      /* the fuse about to end */
  --brace: #06251e;
  --brace-ink: #74f0bd;
  --lit: #f1f5ff;
  --lit-ink: #0c0b12;
  --out: #131319;
  --out-ink: #6f7388;
  --win: #d7f24a;               /* the one celebratory colour in the system, used exactly once */
  --win-ink: #131a02;
  --you: #ff7a3c;               /* only ever means "this is you" */

  /* Standoff's two states that are not "holding it". They must be distinguishable from the
     holder's hot AND from each other at a glance, so they are a cold alarm and a white-hot
     arrival rather than two shades of the same red. */
  --marked: #241206;            /* someone has you in their sights and you do not know who */
  --marked-ink: #ffb95c;
  --inbound: #ffe8d6;           /* it is in the air, at you, right now */
  --inbound-ink: #2a0d00;

  --edge: 0;                    /* vignette strength, written from fuse urgency */

  --gutter: 0px;                /* side space the hero gives up to the ring names */
  --pulse: 720ms;               /* rewritten from fuse urgency: 720ms -> 180ms */
  --tense: 0px;                 /* same urgency as weight, for reduced motion and for silence */
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
body {
  background: var(--idle); color: var(--ink); user-select: none;
  font: 400 16px/1.45 var(--text);
  -webkit-text-size-adjust: 100%;
}
/* touch-action does not inherit. It has to sit on whatever receives the gesture. */
#app, .screen, .ring, .scores, .notice, .seatpad, #arena { touch-action: none; }

#app {
  position: fixed; inset: 0;
  /* dvh, never vh: on iOS Safari the address bar makes vh taller than the visible page and
     pushes the bottom of the layout underneath the browser chrome, where nobody finds it. */
  height: 100dvh;
  transition: background 120ms linear;
  background: var(--idle);
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
/* Every screen fills the app box and CENTRES its content. min-height:0 on the rows is what stops
   a tall child from overflowing its own grid track and letting the next region paint on top of
   it — which is exactly how the seat ring ended up with the game list printed across it. */
.screen { position: absolute; inset: 0; display: grid; min-height: 0; overflow: hidden; }
.screen > * { min-height: 0; min-width: 0; }
.screen[hidden] { display: none; }

/* ---------------------------------------------------------------- type scale */
/* The hero is the screen. A player glances for under a second from arm's length, so the one
   thing that matters is about a quarter of the screen tall and nothing else comes close. */
.big {
  display: block; white-space: nowrap;
  font: 800 clamp(64px, 23vw, 168px)/0.88 var(--display);
  letter-spacing: -0.04em;
  font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1;
}
/* The fuse is the other thing you need while holding it, so it is a number you can read across a
   table — not a caption. Tabular, or the digits jitter and it reads as broken. */
.clock {
  font: 800 clamp(34px, 11vw, 76px)/1 var(--display);
  font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1;
  letter-spacing: -0.03em; opacity: .9; margin-top: 6px;
}
.title {
  font: 700 clamp(15px, 4.6vw, 20px)/1.15 var(--text);
  letter-spacing: .14em; margin-top: 14px; opacity: .92;
}
.sub { font: 400 15px/1.4 var(--text); color: var(--dim); margin: 8px auto 0; max-width: 26ch; }
/* No aim yet — pointing into the gap between two people. A dash reads as a broken screen, so it
   becomes a reticle that is obviously waiting for something rather than reporting nothing. */
.big.noaim { font-size: clamp(54px, 19vw, 132px); opacity: .30; letter-spacing: .12em; }
/* You just caught it and cannot throw it on yet. Without this the player taps, nothing happens,
   and the game reads as broken rather than as locked. */
#play.locked .hero { opacity: .55; }
#play.locked .hero::after {
  content: ""; display: block; height: 3px; width: 46%; margin: 14px auto 0; border-radius: 3px;
  background: currentColor; opacity: .5;
}
.on-light .sub { color: #4a4f63; }

/* -------------------------------------------------------------------- chrome */
.scores {
  position: fixed; top: 0; left: 0; right: 0; z-index: 3;
  padding: calc(9px + env(safe-area-inset-top)) calc(62px + env(safe-area-inset-right)) 9px calc(14px + env(safe-area-inset-left)); display: flex; gap: 11px; justify-content: center;
  flex-wrap: nowrap; overflow: hidden;      /* never a second line: it lands on the ring names */
  font: 600 11px/1 var(--text); letter-spacing: .12em; text-transform: uppercase; color: #7b7f94;
  pointer-events: none;
}
.scores span { white-space: nowrap; }
.scores i { font-style: normal; opacity: .5; }
/* In the lobby the seat ring IS the roster — every player is already on it, at their real angle,
   with their name. A second list of the same names across the top of the heading is noise that
   wraps to two lines and collides with the one instruction that matters. */
body[data-screen="lobby"] .scores,
body[data-screen="lobby"] .ring,
body[data-screen="lobby"] .notice,
body[data-screen="lobby"] .fuse,
body[data-screen="join"] .scores,
body[data-screen="join"] .ring,
body[data-screen="join"] .reset { display: none; }
.scores .out { opacity: .32; text-decoration: line-through; }
.scores .me { color: var(--you); }

.notice {
  position: fixed; left: 0; right: 0; bottom: calc(20px + env(safe-area-inset-bottom)); z-index: 3;
  padding: 0 calc(16px + env(safe-area-inset-left)) 0 calc(16px + env(safe-area-inset-right));
  text-align: center; font: 600 13px/1.3 var(--text); letter-spacing: .06em;
  text-transform: uppercase; color: var(--dim); pointer-events: none;
}
.on-light .notice { color: #5a5f73; }

.reset {
  position: fixed; top: calc(6px + env(safe-area-inset-top)); right: calc(8px + env(safe-area-inset-right)); z-index: 6;
  min-height: 44px;                                   /* a real touch target, not a 28px sliver */
  background: #17141f; color: #7b7f94; border: 1px solid var(--line); border-radius: 999px;
  padding: 8px 13px; margin: 0; font: 600 11px/1 var(--text); letter-spacing: .14em;
}
.warn {
  position: fixed; top: 8px; left: 50%; transform: translateX(-50%); z-index: 6;
  background: #3a2a10; color: #ffc857; padding: 5px 12px; border-radius: 999px;
  font: 600 11px/1 var(--text); letter-spacing: .1em;
}
.warn[hidden] { display: none; }

/* The fuse, drawn. Every phone gets this, holder or not, because the rising tone is already
   shared — only WHO holds it is secret. This is how a deaf player reads the tension. */
/* Every phone gets this, holder or not, because the rising tone is already shared — only WHO
   holds it is secret. It is how a deaf player reads the tension and how anyone reads it from
   across a table, so it is a band and not a hairline. */
/* The room's tension, drawn on the walls. Every phone gets it whether or not it is holding
   anything, because the fuse tone is already shared — only WHO holds it is secret. It closes in
   as the fuse burns, so a player who is looking at other people still feels the clock in their
   peripheral vision. */
#app::after {
  content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 1;
  box-shadow: inset 0 0 calc(var(--edge) * 90px) calc(var(--edge) * 26px) currentColor;
  opacity: .55; transition: box-shadow 140ms linear;
}


/* It is in the air AT YOU. A band at the top, closing over the flight — the top, so it can never
   be confused with the fuse along the bottom. Driven from the arrival DEADLINE against the synced
   clock, never from a number the server rendered. */
.inbound {
  position: fixed; left: 0; right: 0; top: 0; z-index: 5; background: #00000030;
  height: calc(10px + env(safe-area-inset-top));
  padding-top: env(safe-area-inset-top);
}
.inbound[hidden] { display: none; }
.inbound i { display: block; height: 100%; width: 100%; background: var(--inbound-ink); transform-origin: right center; }

.fuse {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 4; background: #ffffff10;
  height: calc(14px + env(safe-area-inset-bottom));
  padding-bottom: env(safe-area-inset-bottom);        /* the bar itself stays above the home indicator */
}
.fuse[hidden] { display: none; }
.fuse i { display: block; height: 100%; width: 100%; background: var(--ink); transform-origin: left center; }

/* -------------------------------------------------------------- state chip (shape, not colour) */
.chip {
  display: inline-flex; align-items: center; gap: 10px;
  font: 700 11px/1 var(--text); letter-spacing: .16em; text-transform: uppercase; opacity: .7;
}
.chip[hidden] { display: none; }
.shape { width: 13px; height: 13px; border: 2px solid currentColor; }
.shape.circle { border-radius: 50%; }                               /* waiting, nothing known */
.shape.diamond { transform: rotate(45deg); background: currentColor; }   /* you are holding it */
.shape.triangle { width: 0; height: 0; border: 7px solid transparent; border-bottom-color: currentColor; } /* braced */
.shape.square { background: currentColor; }                          /* out */

/* ------------------------------------------------------------------ play screen */
/* Three rows: the chip at the top, the hero owning the middle, the fuse at the bottom. The hero
   row is the only one that grows, so the hero is always vertically centred in whatever is left
   and can never be pushed off the screen by the chrome around it. */
#play {
  grid-template-rows: auto minmax(0, 1fr) auto;
  justify-items: center; align-items: center;
  text-align: center; padding: 0 var(--gutter);
}
/* The chip lives inside the hero now, directly above the state word, so the shape and the word
   are one object rather than two things shouting from opposite ends of the screen. */
#play .chip { margin: 0 auto 14px; }
#play .hero { grid-row: 2; max-width: 100%; align-self: center; }
#play #arena { grid-row: 1 / -1; }
#play.arena-on .hero, #play.arena-on .chip { display: none; }

/* Ring names live in the gutters the hero gave up. They are the swipe targets, so their angles
   are the truth — the text moves, not them. */
.ring { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
.ring b {
  position: absolute; transform: translate(-50%, -50%);
  font: 600 11px/1 var(--text); letter-spacing: .1em; text-transform: uppercase;
  color: #a7abbe; white-space: nowrap;
}
.ring b::before {
  content: ""; display: block; width: 5px; height: 5px; border-radius: 50%;
  background: currentColor; margin: 0 auto 5px; opacity: .7;
}
.on-light .ring b { color: #5a5f73; }

#arena { position: absolute; inset: 0; width: 100%; height: 100%; display: none; }
#play.arena-on #arena { display: block; }

/* ------------------------------------------------------------------ join screen */
#join { place-items: center; text-align: center; padding: 24px; align-content: center; }
.wordmark {
  font: 800 clamp(54px, 17vw, 104px)/0.86 var(--display); letter-spacing: -0.05em;
}
.lede {
  font: 700 clamp(19px, 5.4vw, 26px)/1.25 var(--display); letter-spacing: -0.015em;
  margin: 16px auto 0; max-width: 17ch;
}
.fine { font: 400 13px/1.4 var(--text); color: var(--dim); margin: 12px auto 0; max-width: 28ch; }
input {
  font: 600 19px var(--text); padding: 15px; border-radius: 14px; border: 1px solid var(--line);
  background: var(--raise); color: var(--ink); width: min(78vw, 300px); text-align: center;
}
input::placeholder { color: #6a6e82; }
button {
  font: 600 16px var(--text); padding: 15px 26px; border-radius: 14px; border: 0;
  background: var(--ink); color: var(--idle); margin: 6px 4px 0;
}
button.ghost { background: var(--raise); color: var(--ink); border: 1px solid var(--line); }
button:disabled { opacity: .38; }

.seatnotice { grid-area: notice; margin:0; padding:9px 16px; border-radius:999px;
  background:#b0442a; color:#fff; font:700 14px/1.3 var(--text); text-align:center;
  max-width:34ch; }
.seatnotice[hidden] { display:none; }

/* ----------------------------------------------------------------- lobby + seats */
/* Four named regions, stacked, each with its own track. The ring gets every pixel left over
   after the other three have taken what they need, and it can never take more — so nothing here
   can overlap anything else and nothing can fall off the bottom.

   The previous rule was `grid-template-rows: auto 1fr auto` with FOUR children and
   `align-items: start`. The fourth child landed in an implicit row; and because the content
   overflowed there was no free space, so the 1fr ring track collapsed to almost nothing while
   the ring itself still rendered ~300px tall. Everything after it was laid out under the
   COLLAPSED TRACK rather than under the visible circle: the notice at y=117 and the game list at
   y=182, both printed straight across the ring, with the list running to y=1026 on an 812px
   screen. */
#lobby {
  grid-template-rows: auto minmax(64px, 1fr) auto auto;
  grid-template-areas: "lead" "ring" "notice" "games";
  align-content: stretch; justify-items: center;
  gap: 10px;
  padding: max(18px, env(safe-area-inset-top)) 16px calc(12px + env(safe-area-inset-bottom));
  text-align: center;
  overflow: hidden;                      /* a 20-second round gives nobody time to scroll */
}
/* The instruction IS the mechanic, so it is the biggest thing on the screen. */
.lead {
  grid-area: lead;
  font: 800 clamp(21px, 6.2vw, 32px)/1.06 var(--display); letter-spacing: -0.03em;
  margin: 0; max-width: 15ch;
}
.seatpad { grid-area: ring; display: grid; place-items: center; min-height: 0; width: 100%; }
/* The ring is the thing you are being told to use, so it sits close under the instruction rather
   than floating in the middle of its track with dead space above it. */
#lobby { align-items: center; }
/* Sized from the track it is in, not from vh. max-height is what makes it give way when the
   game list below it grows, instead of overflowing and being drawn on. */
.seats {
  position: relative; width: min(100%, 78vw, 340px); aspect-ratio: 1; max-height: 100%;
  border: 1px dashed var(--line); border-radius: 50%;
}
.seats::after {
  content: "table"; position: absolute; inset: 0; display: grid; place-items: center;
  font: 600 10px var(--text); letter-spacing: .22em; text-transform: uppercase; color: #4d5164;
}
.seat {
  position: absolute; transform: translate(-50%, -50%); display: grid; place-items: center; gap: 5px;
  font: 600 11px/1 var(--text); letter-spacing: .1em; text-transform: uppercase; color: #9c9fb4;
}
/* Two people who have not moved apart yet sit at the same angle, and two labels at the same point
   render as one unreadable smear, so the label is capped and ellipsised. The clip lives on the
   LABEL and not on .seat, because overflow:hidden on the container also clips its children's
   box-shadow — which squared the glow around your own dot into a brown rectangle. */
.seat span { display: block; max-width: 9ch; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seat s { display: block; width: 16px; height: 16px; border-radius: 50%; background: #454a5e; }
/* Yours is not a slightly bigger dot of the same colour — it is a different object: the accent
   that only ever means "this is you", at a 44px touch target, with a halo. At arm's length the
   question "which one am I" has to answer itself. */
.seat.mine { color: var(--you); z-index: 2; }
.seat.mine s {
  width: 44px; height: 44px; background: var(--you);
  border: 3px solid #fff3;
  box-shadow: 0 0 0 8px rgba(255, 122, 60, .18);
}
.seat.mine.held s { box-shadow: 0 0 0 15px rgba(255, 122, 60, .26); }
.seat.unplaced s { background: #2c3042; border: 2px dashed #5b6076; }
/* Your dot before you have placed it is the only moving thing on the lobby, because moving it is
   the only thing you have to do. */
.seat.mine.unplaced s {
  background: var(--you); border: 3px dashed #fff6;
  animation: beg 1200ms ease-in-out infinite alternate;
}
@keyframes beg { from { box-shadow: 0 0 0 6px rgba(255,122,60,.14); } to { box-shadow: 0 0 0 18px rgba(255,122,60,.03); } }
@media (prefers-reduced-motion: reduce) { .seat.mine.unplaced s { animation: none; } }
/* Eight game cards on a phone is a wall, and the one control a player MUST use was buried
   underneath it. One hero game, full width, unmissable; everything else folded behind a single
   line of text that a stranger can ignore completely. */
.modes { grid-area: games; display: grid; gap: 8px; width: min(100%, 420px); margin: 0; }

.modes .hero-game {
  width: 100%; margin: 0; padding: 16px 18px; text-align: left;
  display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 12px;
  background: var(--ink); color: var(--idle); border: 0; border-radius: 16px;
}
.modes .hero-game b { grid-area: 1 / 1; font: 800 clamp(21px, 6vw, 27px)/1 var(--display); letter-spacing: -0.02em; }
.modes .hero-game small { grid-area: 2 / 1; font: 400 12.5px/1.3 var(--text); opacity: .66; }
.modes .hero-game em {
  grid-area: 1 / 2 / span 2 / 3; align-self: center;
  font: 800 12px/1 var(--text); letter-spacing: .14em; font-style: normal;
  padding: 11px 16px; border-radius: 999px; background: #0003;
}
.modes .hero-game:disabled { opacity: 1; background: var(--raise); color: var(--dim); }
.modes .hero-game:disabled em { background: #fff1; }

.modes details { width: 100%; }
.modes summary {
  list-style: none; cursor: pointer; padding: 10px; border-radius: 10px;
  font: 600 12px/1 var(--text); letter-spacing: .14em; text-transform: uppercase; color: var(--dim);
}
.modes summary::-webkit-details-marker { display: none; }
.modes summary::after { content: " \25BE"; }
.modes details[open] summary::after { content: " \25B4"; }
.modes .rest { display: grid; gap: 6px; max-height: 34dvh; overflow-y: auto; touch-action: pan-y; padding-top: 4px; }
.modes .rest button {
  width: 100%; text-align: left; padding: 11px 14px; margin: 0;
  display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 10px;
  font: 600 14px var(--text);
}
.modes .rest b { grid-area: 1 / 1; font: 700 14px/1.2 var(--text); }
.modes .rest small { grid-area: 2 / 1; font: 400 11.5px/1.3 var(--text); opacity: .6; }
.modes .rest em { grid-area: 1 / 2 / span 2 / 3; align-self: center; font: 600 10px var(--text); letter-spacing: .14em; font-style: normal; opacity: .55; }
.modes .rest button.on { border-color: #4a4356; background: #211c2d; }

@media (orientation: landscape) and (max-height: 560px) {
  #lobby {
    grid-template-columns: 1fr 1fr;
    grid-template-rows: auto minmax(0, 1fr) auto;
    grid-template-areas: "lead lead" "ring games" "notice notice";
    padding-top: max(10px, env(safe-area-inset-top));
  }
  .lead { font-size: clamp(17px, 3.6vw, 24px); max-width: none; }
  .modes { align-self: center; }
  .modes .rest { max-height: 30dvh; }
}

/* ============================================================================
   MOTION. Four animations, and each one carries information a static screen
   could not. Anything beyond these four reads as noise.
   ========================================================================= */
@keyframes pulse { from { transform: scale(1); } to { transform: scale(1.055); } }
@keyframes punch {
  0%   { transform: scale(.8);   filter: brightness(3.4) saturate(.2); }
  38%  { transform: scale(1.06); filter: none; }
  100% { transform: scale(1);    filter: none; }
}
@keyframes streak { from { opacity: .85; transform: translate(-50%, -50%) scaleX(.15); }
                    to   { opacity: 0;   transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scaleX(1); } }
@keyframes cut { 0% { background: var(--lit); } 50% { background: #000; } 100% { background: var(--out); } }

.hero.pulsing { animation: pulse var(--pulse) infinite alternate ease-in-out; }
#play.punching { animation: punch 320ms ease-out; }
#app.cutting { animation: cut 200ms steps(1, end) 1; }   /* elimination is a cut. No easing. */
.streak {
  position: fixed; top: 50%; left: 50%; z-index: 5; pointer-events: none;
  width: 46vw; height: 4px; border-radius: 4px; background: var(--ink);
  transform-origin: left center; animation: streak 300ms ease-out forwards;
}

/* Under reduced motion nothing moves. Urgency becomes weight and colour instead: the hero grows
   a ring that thickens as the fuse burns, and the fuse bar is still draining. */
@media (prefers-reduced-motion: reduce) {
  .hero.pulsing, #play.punching, #app.cutting, .streak { animation: none; }
  .streak { display: none; }
  .hero.pulsing {
    outline: var(--tense) solid currentColor; outline-offset: 14px; border-radius: 8px;
  }
  #app { transition: none; }
}
</style>
</head>

<body>
<button class="reset" id="reset" title="back to lobby">RESET</button>
<div class="warn" id="warn" hidden>RECONNECTING</div>

<div id="app">
  <!-- the poster: what a stranger reads over someone's shoulder -->
  <section class="screen" id="join">
    <div>
      <div class="wordmark">HUDDLE</div>
      <p class="lede">One link. Every phone sees a different truth.</p>
      <div style="margin-top:20px"><input id="n" placeholder="your name" maxlength="12" autocomplete="off" enterkeyhint="go"></div>
      <button id="j">Join</button>
      <p class="fine">No app, no account. Everyone has to be in the same room &mdash; that is the point.</p>
    </div>
  </section>

  <section class="screen" id="lobby" hidden>
    <h1 class="lead">Put yourself where you&rsquo;re actually sitting.</h1>
    <div class="seatpad"><div class="seats" id="seats"></div></div>
    <div class="seatnotice" id="seatnotice" role="status" aria-live="polite"></div>
    <div class="modes" id="modes"></div>
  </section>

  <section class="screen" id="play" hidden>
    <div class="hero" id="hero">
      <div class="chip" id="chip"><span class="shape circle" id="shape"></span><span id="chipText"></span></div>
      <div class="big" id="big"></div>
      <div class="clock" id="clock" hidden></div>
      <div class="title" id="title"></div>
      <div class="sub" id="sub"></div>
    </div>
    <canvas id="arena"></canvas>
  </section>
</div>

<div class="ring" id="ring"></div>
<div class="scores" id="scores"></div>
<div class="notice" id="notice" role="status" aria-live="polite"></div>
<div class="inbound" id="inbound" hidden aria-hidden="true"><i id="inboundFill"></i></div>
<div class="fuse" id="fuse" hidden aria-hidden="true"><i id="fuseFill"></i></div>

<script type="module">
import { aimAngle, aimDue, aimFromSeat, askForTilt, attachTilt } from "/tilt.js";
import { nearest } from "/seats.js";
const $ = (id) => document.getElementById(id);
const app = $("app"), ringEl = $("ring"), play = $("play"), hero = $("hero");
const bigEl = $("big"), clockEl = $("clock"), titleEl = $("title"), subEl = $("sub");
const chipEl = $("chip"), shapeEl = $("shape"), chipText = $("chipText");
const seatsEl = $("seats"), modesEl = $("modes"), fuseEl = $("fuse"), fuseFill = $("fuseFill");

// Identity survives a reload or a dropped socket, so a phone that locked comes back as the SAME
// player instead of a new dead one.
const store = window.sessionStorage;
const TOKEN = store.token || (store.token = (crypto.randomUUID?.() || String(Math.random()).slice(2)));

let ws = null, me = null, S = null, offset = 0, joined = false, name = store.name || "";
let ac = null, osc = null, gain = null, lastPong = Date.now(), dropped = false;
const offsets = [];
const serverNow = () => Date.now() + offset;
const clamp01 = (n) => Math.max(0, Math.min(1, n));

// ---- clock sync. Every timed thing on every phone is computed from this, which is why Flash can
// light up on all of them at the same instant without the server sending a frame. ----
const ping = () => ws?.readyState === 1 && ws.send(JSON.stringify({ t: "ping", c: Date.now() }));
function onPong(m) {
  lastPong = Date.now();
  offsets.push(m.s - (m.c + (Date.now() - m.c) / 2));
  // Evict the OLDEST sample, which means evicting before the sort. Sorting in place and then
  // shifting drops the smallest offset instead, so after twenty-four pongs the window holds the
  // twenty-four largest values ever seen and the median climbs for as long as the page is open.
  // Every phone then believes the server is further ahead than it is: Flash lights early, every
  // countdown under-reads, and the one number this project claims — that every phone agrees on
  // the same millisecond — quietly stops being true over the length of an expo.
  if (offsets.length > 24) offsets.shift();
  const sorted = [...offsets].sort((a, b) => a - b);
  offset = sorted[sorted.length >> 1];
}

function audioOn() {
  if (ac) return;
  ac = new (window.AudioContext || window.webkitAudioContext)();
  if (navigator.audioSession) try { navigator.audioSession.type = "playback"; } catch {}
  osc = ac.createOscillator(); gain = ac.createGain();
  gain.gain.value = 0; osc.type = "sawtooth"; osc.frequency.value = 120;
  osc.connect(gain); gain.connect(ac.destination); osc.start();
}
function tone(level) {
  if (!gain) return;
  if (ac.state !== "running") ac.resume().catch(() => {});
  gain.gain.setTargetAtTime(level > 0 ? 0.04 : 0, ac.currentTime, 0.07);
  if (level > 0) osc.frequency.setTargetAtTime(120 + level * 520, ac.currentTime, 0.12);
}
// A garnish on the Androids that have it, never a signal we depend on: iOS Safari cannot vibrate,
// so every state below is already legible without it.
const buzz = (ms) => navigator.vibrate?.(ms);

// ---- tilt ----------------------------------------------------------------------
// The phone itself is the stick. Continuous, physical, and visible from across the room, which is
// the whole reason the handoff says to build it: a tap is a thing that happens somewhere else, a
// tilt is your hand on the object.
//
// The client sends the STICK, never a position. The server integrates it. A phone that could
// declare where its ship is could declare that it is standing on top of yours.
let tilt = null, tiltWhy = null, tiltSent = 0, seatYaw = null, seatAnchor = null,
    aimSent = 0, aimLast = null, aimTimer = null;

/** Who this angle would actually reach, using the same arithmetic the server will use. */
function whoIsAt(angle) {
  const meId = myId();
  const others = (S?.players || []).filter((q) => q.alive && q.id !== meId);
  if (!others.length) return null;
  return nearest(others, { id: meId }, angle);
}

/**
 * A swipe, turned into a direction in the room rather than a direction on a screen.
 *
 * The seat ring and the swipe are both drawn in the phone's own frame, so they mean the same
 * thing only while the phone keeps the yaw it was seated at. Someone who picks their phone up,
 * turns to talk to a neighbour and swipes is aiming at a person; without this they are aiming at
 * whoever happens to be at that angle on a screen that has since rotated under them.
 *
 * Falls back to the raw screen angle whenever there is no yaw to work with, which is what this
 * has always done and is exactly right for a laptop or a phone that refused the sensor.
 */
function aimFor(screenAngle) {
  const yaw = tilt?.yaw();
  // With no sensor the phone cannot know which way it is facing, so a swipe stays exactly what it
  // looks like: a direction on the screen, resolved against the names drawn in the gutters. That
  // is the laptop and denied-motion path and it is a complete way to play.
  if (yaw == null || seatYaw == null || seatAnchor == null) return screenAngle;
  // With a sensor, a swipe is measured from wherever the phone is NOW pointing: the gesture is
  // relative to the top of the screen, and the top of the screen is somewhere in the room.
  const facing = aimFromSeat(seatAnchor, yaw, seatYaw, !!S?.aimInvert);
  const a = facing + (screenAngle - POINTING);
  return Math.atan2(Math.sin(a), Math.cos(a));
}

function tiltPipe(x, y) {
  if (!joined || !ws || ws.readyState !== 1) return;
  if (!S || S.phase !== "live" || !S.you?.alive) return;
  if (!S.view?.wantsTilt) return;                   // only a mode that asked for it pays the wire
  const t = Date.now();
  if (t - tiltSent < 33) return;                    // 30Hz ceiling regardless of the sensor's rate
  tiltSent = t;
  ws.send(JSON.stringify({ t: "act", a: "tilt", x, y }));
}

// Pointing the phone AT somebody. The top edge of the phone is the barrel, and the top edge is
// screen angle -pi/2 because screen y runs downward — so the direction the phone is physically
// pointing is that constant, carried into the frame the player was seated in.
//
// The client sends the ANGLE and nothing else. Never a name, never an id. The server decides who
// is sitting there, which is both hard rule 2 and the entire claim: your input targets a human
// being at the angle they are actually sitting, and the phone is not trusted to say who that is.
const POINTING = -Math.PI / 2;
// Comfortably inside the server's stale window, and 4 messages a second per phone is nothing.
const AIM_BEAT = 250;

function aimPipe() {
  if (!joined || !ws || ws.readyState !== 1) return;
  if (!S || S.phase !== "live" || !S.you?.alive || !S.view?.wantsAim) return;
  const yaw = tilt?.yaw();
  if (yaw == null || seatYaw == null || seatAnchor == null) return;   // not seated: nothing to aim from
  const angle = aimFromSeat(seatAnchor, yaw, seatYaw, !!S?.aimInvert);
  const t = Date.now();
  if (!aimDue(aimLast, angle, t - aimSent, { beat: AIM_BEAT })) return;
  aimSent = t;
  aimLast = angle;
  ws.send(JSON.stringify({ t: "act", a: "aim", angle }));
}

/**
 * iOS grants orientation only inside a real user gesture, so this runs in the Join handler
 * alongside the AudioContext. Everything it can return is a playable state — the drag fallback is
 * not a degraded mode, it is how anyone who cannot tilt a phone plays, which is also the
 * accessibility answer.
 */
async function armTilt() {
  if (tilt) return;
  const verdict = await askForTilt();
  tiltWhy = verdict;
  if (verdict !== "granted") return;
  tilt = attachTilt({ onStick: tiltPipe, hz: 30 });
  // Its OWN loop, not the stick's. onStick fires only when the stick has moved, so hanging the
  // aim off it meant a phone held perfectly still never reached the heartbeat at all — which is
  // precisely the player who has just turned to face the person who threw the bomb at them.
  clearInterval(aimTimer);
  aimTimer = setInterval(aimPipe, 80);
}

/** Whatever you are holding when a round starts is neutral. Without this, half a room is fighting
 *  an offset it cannot see and concludes the game is broken. */
function recalibrate() { tilt?.recalibrate(); }

/** One line, once, and never mid-round: why your phone is not tilting. */
function tiltNotice() {
  if (tilt?.live) return null;
  if (tiltWhy === "insecure") return "open the https link — a plain http page gets no sensor at all";
  if (tiltWhy === "denied") return "motion access denied — drag to move instead";
  if (tiltWhy === "unsupported" || tiltWhy === null) return "no motion sensor here — drag to move instead";
  return "tilt your phone";                          // granted, but nothing has arrived yet
}

// ---- input --------------------------------------------------------------------
let down = null, aiming = null;
for (const t of ["pointerdown", "pointerup"]) $("reset").addEventListener(t, (e) => e.stopPropagation());
$("reset").onclick = () => {
  ws?.send(JSON.stringify({ t: "reset" }));
  ws?.send(JSON.stringify({ t: "kickGhosts" }));
};
addEventListener("pointerdown", (e) => { down = { x: e.clientX, y: e.clientY }; aiming = null; });
addEventListener("pointercancel", () => { down = null; aiming = null; });
// A throw you cannot aim is a coin flip you are blamed for. While the finger is down the phone
// names the person the swipe currently resolves to, which is also the fastest way to see that
// turning your body changes who you are pointing at — the entire claim, felt rather than read.
addEventListener("pointermove", (e) => {
  if (!down || !joined || !S || S.phase !== "live" || onScreen !== "play") return;
  if (!S.you?.alive) return;                              // a throw you cannot make must not be previewed
  if (S.view?.kind === "arena") return;                   // an arena aims inside its own screen
  // When the phone itself is the pointer, the server is already naming the target in the hero slot and a
  // drag preview would be a second, disagreeing answer on the same screen.
  if (S.view?.wantsAim && tilt?.live) return;
  const dx = e.clientX - down.x, dy = e.clientY - down.y;
  if (Math.hypot(dx, dy) <= 38) { aiming = null; return; }
  aiming = whoIsAt(aimFor(Math.atan2(dy, dx)))?.name || null;
});
addEventListener("pointerup", (e) => {
  const start = down; down = null; aiming = null;
  if (!start || !joined || !S || S.phase !== "live") return;
  const dx = e.clientX - start.x, dy = e.clientY - start.y;
  // In an arena the two gestures mean different things from everywhere else: you are aiming
  // inside your own screen, not at a person across the table. A tap fires toward where you
  // tapped, measured from your own ship, so "shoot over there" is one gesture and the ship
  // never teleports to your finger.
  if (S.view?.kind === "arena") {
    if (Math.hypot(dx, dy) > 38) return;             // that was a drag; the move handler had it
    const you = S.view.you;
    if (!you) return;
    const dir = Math.atan2(e.clientY / innerHeight - you.y, e.clientX / innerWidth - you.x);
    ws?.send(JSON.stringify({ t: "act", a: "fire", dir }));
    firedAt = Date.now();
    buzz(12);
    return;
  }
  if (Math.hypot(dx, dy) > 38) {
    const drawn = Math.atan2(dy, dx);
    ws?.send(JSON.stringify({ t: "act", a: "swipe", angle: aimFor(drawn) }));
    streak(drawn);                                  // the streak follows the finger, not the room
    buzz(18);
  } else ws?.send(JSON.stringify({ t: "act", a: "tap" }));
});

function streak(angle) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const el = document.createElement("div");
  el.className = "streak";
  el.style.setProperty("--tx", `${Math.cos(angle) * innerWidth * 0.8}px`);
  el.style.setProperty("--ty", `${Math.sin(angle) * innerWidth * 0.8}px`);
  el.style.rotate = `${angle}rad`;
  document.body.append(el);
  el.addEventListener("animationend", () => el.remove());
}

// ---- connection, with reconnect. iOS freezes sockets on screen lock and often never fires
// onclose, so silence on the ping/pong is the real signal. ----
function connect() {
  ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}`);
  ws.onopen = () => {
    dropped = false; lastPong = Date.now(); $("warn").hidden = true;
    for (let i = 0; i < 5; i++) setTimeout(ping, i * 110);
    if (name) ws.send(JSON.stringify({ t: "join", name, token: TOKEN }));
  };
  ws.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    if (m.t === "pong") return onPong(m);
    if (m.t === "hello") { me = m.id; joined = true; return; }
    if (m.t === "view") S = m;
  };
  ws.onclose = () => { dropped = true; $("warn").hidden = false; setTimeout(connect, 700); };
  ws.onerror = () => ws.close();
}
setInterval(() => {
  ping();
  if (joined && Date.now() - lastPong > 9000 && ws?.readyState === 1) ws.close();
}, 3000);
connect();

// Short, loud, and legible across a table, because a name here is a TARGET: someone is about to
// look at the ring, find you, and turn their phone at you. "player" — which is what every walk-up
// who taps Join without typing used to become — is none of those things, and a room containing
// four of them cannot be aimed at.
const CALLSIGNS = ["FOX", "IVY", "OWL", "JET", "ASH", "ELM", "KOI", "YAK", "ORB", "ZIP",
                   "MOTH", "LARK", "REEF", "DUNE", "FERN", "PIKE", "WREN", "ONYX", "HAWK", "CUSP"];

$("j").onclick = () => {
  audioOn();                                        // iOS only grants audio inside a real gesture
  armTilt();                                        // and orientation, in the same one
  name = store.name = ($("n").value.trim() || CALLSIGNS[Math.floor(Math.random() * CALLSIGNS.length)]).slice(0, 12);
  ws?.send(JSON.stringify({ t: "join", name, token: TOKEN }));
};
$("n").value = name;
$("n").onkeydown = (e) => { if (e.key === "Enter") $("j").click(); };

// ---- seat picker ----------------------------------------------------------------
// Drag your own dot to where you are actually sitting. This is the only input in the product
// that makes the headline claim true, so it gets the whole lobby screen.
let drag = null, mySeat = null, lastSeatSend = 0;
const seatEls = new Map();

function myId() { return S?.you?.id ?? me; }
function seatData() {
  if (S?.view?.seats) return S.view.seats.map((s) => ({ ...s, you: s.you ?? s.id === myId() }));
  return (S?.players || []).map((p) => ({ id: p.id, name: p.name, angle: p.seat || 0, placed: p.placed, you: p.id === myId() }));
}

function placeSeats() {
  // Only people who have actually said where they are get drawn on the ring — plus you, always,
  // because your dot is the control you are being asked to move.
  //
  // Everyone starts unplaced at angle 0. Drawing them there means four people who just scanned
  // the QR all appear stacked on one point of the circle with their names smeared over each
  // other, which reads as a broken screen at the exact moment a stranger is deciding whether
  // this thing works. They are not missing — the notice underneath names them.
  const list = seatData().filter((q) => q.placed !== false || q.you);
  const box = seatsEl.clientWidth;
  if (!box) return;
  const r = box / 2 - 22, c = box / 2;
  for (const [id, el] of seatEls) if (!list.some((s) => s.id === id)) { el.remove(); seatEls.delete(id); }
  for (const s of list) {
    let el = seatEls.get(s.id);
    if (!el) {
      el = document.createElement("div");
      el.innerHTML = "<s></s><span></span>";
      seatsEl.append(el);
      seatEls.set(s.id, el);
    }
    const angle = s.you && mySeat != null ? mySeat : s.angle;
    el.className = `seat${s.you ? " mine" : ""}${s.you && drag ? " held" : ""}${s.placed === false ? " unplaced" : ""}`;
    el.lastChild.textContent = s.you ? (s.placed === false ? "drag me" : "you") : s.name;
    el.style.left = `${c + Math.cos(angle) * r}px`;
    el.style.top = `${c + Math.sin(angle) * r}px`;
  }
}

// Grabbing anywhere in the circle moves your dot: at arm's length nobody hits a 30px target.
function seatAngle(e) {
  const b = seatsEl.getBoundingClientRect();
  return Math.atan2(e.clientY - (b.top + b.height / 2), e.clientX - (b.left + b.width / 2));
}
function pushSeat(force) {
  const t = Date.now();
  if (!force && t - lastSeatSend < 60) return;       // live enough to watch, quiet enough to not flood
  lastSeatSend = t;
  // The moment you place your dot is the one moment in the game where we know what you are doing:
  // you are LOOKING at the phone, so its top edge points away from you, across the table. That
  // gives us both halves of the anchor — the direction the phone was pointing (yaw) and the
  // direction in the room that corresponds to (your seat, facing the middle).
  const yaw = tilt?.yaw();
  if (yaw != null) seatYaw = yaw;
  seatAnchor = mySeat;
  ws?.send(JSON.stringify({ t: "seat", angle: mySeat }));
}
seatsEl.addEventListener("pointerdown", (e) => {
  e.stopPropagation();                               // must not read as a swipe at a person
  drag = e.pointerId; seatsEl.setPointerCapture(e.pointerId);
  mySeat = seatAngle(e); pushSeat(true); placeSeats();
});
seatsEl.addEventListener("pointermove", (e) => {
  if (drag !== e.pointerId) return;
  mySeat = seatAngle(e); pushSeat(false); placeSeats();
});
for (const t of ["pointerup", "pointercancel"]) seatsEl.addEventListener(t, (e) => {
  if (drag !== e.pointerId) return;
  e.stopPropagation();
  drag = null; pushSeat(true); placeSeats();
});

// One hero game, and the rest folded away.
//
// Eight cards on a phone is a wall, and it was sitting on top of the seat ring — the one control
// a player is actually REQUIRED to use. A stranger should be able to put themselves on the ring
// and press one obvious button without ever reading a list. The rest stay one tap away for us.
let modeSig = "";
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function drawModes() {
  // Count the way the SERVER counts. startRound refuses unless `min` players have actually placed
  // a seat — alive() requires it and seatBlocker checks it — but this counted everyone who had
  // merely joined. So a card sat there looking live, someone tapped it, and the room bounced
  // straight back to the lobby with no explanation. A control that is not going to work has to
  // look like it is not going to work.
  const seated = seatData().filter((q) => q.placed !== false).length;
  const enough = seated;
  const sig = S.modes.map((m) => `${m.key}${m.key === S.mode ? "*" : ""}${m.min <= enough}`).join("|") + `/${seated}`;
  if (sig === modeSig) return;
  const wasOpen = modesEl.querySelector("details")?.open;
  modeSig = sig;

  // The hero is whatever the room is currently on, which the server boots to standoff.
  const hero = S.modes.find((m) => m.key === S.mode) || S.modes[0];
  const rest = S.modes.filter((m) => m !== hero);
  const ready = (m) => m.min <= enough;

  const card = (m, cls) => `
    <button class="${cls}" data-k="${esc(m.key)}" ${ready(m) ? "" : "disabled"}>
      <b>${esc(m.name)}</b><em>${ready(m) ? "START" : `${m.min - seated} MORE SEAT${m.min - seated === 1 ? "" : "S"}`}</em>
      <small>${esc(m.blurb)}</small>
    </button>`;

  modesEl.innerHTML = card(hero, "hero-game") + `
    <details${wasOpen ? " open" : ""}>
      <summary>other games</summary>
      <div class="rest">${rest.map((m) => card(m, "ghost")).join("")}</div>
    </details>`;

  for (const b of modesEl.querySelectorAll("button[data-k]")) b.onclick = (e) => {
    e.stopPropagation();
    ws.send(JSON.stringify({ t: "start", mode: b.dataset.k }));
  };
  // A tap on the disclosure must not read as a swipe at a person.
  modesEl.querySelector("summary")?.addEventListener("pointerdown", (e) => e.stopPropagation());
}

// ---- ring of players, in the gutters ---------------------------------------------
// Names are placed by projecting the seat angle onto the edge of the screen, not onto a circle
// sized to the narrow axis — on a tall phone that circle drops names straight onto the hero text.
let ringSig = "";
function drawRing(list) {
  const sig = (list || []).map((p) => `${p.name}@${p.angle.toFixed(2)}`).join("|") + `/${innerWidth}x${innerHeight}`;
  if (sig === ringSig) return;
  ringSig = sig;
  ringEl.innerHTML = "";
  if (!list?.length) return;
  const W = innerWidth, H = innerHeight, cx = W / 2, cy = H / 2;
  const hw = cx - 12, hh = cy - 12;
  for (const p of list) {
    const b = document.createElement("b");
    b.textContent = p.name;
    ringEl.append(b);
    const co = Math.cos(p.angle), si = Math.sin(p.angle);
    const t = Math.min(hw / Math.max(1e-6, Math.abs(co)), hh / Math.max(1e-6, Math.abs(si)));
    const w = b.offsetWidth / 2 + 8, h = b.offsetHeight / 2 + 4;
    b.style.left = `${Math.min(W - w, Math.max(w, cx + co * t))}px`;
    b.style.top = `${Math.min(H - h - 40, Math.max(h + 52, cy + si * t))}px`;
  }
}

// ---- arena renderer (Duel) ---------------------------------------------------------
// Coordinates are normalised 0-1 inside your own screen. The server owns every position; this
// only draws, and interpolates between broadcasts so a 20Hz feed still looks like 60fps.
//
// The whole point of this mode is that your screen is one panel of a board made of everybody's
// phones, so the two things that have to read instantly are WHERE THE EDGES ARE and WHO IS ON THE
// OTHER SIDE of them. A shot leaving the right edge is not leaving the game, it is arriving on the
// phone of the person sitting to your right — and for a moment in between it is on nobody's
// screen at all.
//
// Drag sends {t:'act', a:'move', x, y}; a tap sends {t:'act', a:'fire', dir} where dir is the
// angle from your ship to where you tapped. Tilt sends {t:'act', a:'tilt', x, y}.
const arena = $("arena"), actx = arena.getContext("2d");
let frames = [null, null];
let lastHp = null, hitAt = -9999, firedAt = -9999;
function feedArena(v) {
  const last = frames[1];
  if (!last || last.at !== (S.now || 0)) frames = [last || { v, at: S.now }, { v, at: S.now || Date.now() }];
}

/** Neighbour names, as the mode sends them: "BRAVO \u2190    \u2192 CHARLIE". */
function neighbours(sub) {
  const out = { left: "", right: "" };
  for (const part of String(sub || "").split(/\s{2,}/)) {
    const t = part.trim();
    if (!t) continue;
    if (t.includes("\u2190")) out.left = t.replace("\u2190", "").trim();
    else if (t.includes("\u2192")) out.right = t.replace("\u2192", "").trim();
  }
  return out;
}

function drawArena() {
  const cur = frames[1]?.v, prev = frames[0]?.v || cur;
  if (!cur) return;
  const dpr = Math.min(devicePixelRatio || 1, 2), W = innerWidth, H = innerHeight;
  if (arena.width !== W * dpr) { arena.width = W * dpr; arena.height = H * dpr; }
  actx.setTransform(dpr, 0, 0, dpr, 0, 0);
  actx.clearRect(0, 0, W, H);

  // Against the SYNCED clock, not the local one: frames are stamped with the server's time, and a
  // phone whose clock is off otherwise pins this at 1 and throws away every interpolated frame,
  // which reads as a stutter rather than as a clock bug.
  const k = clamp01((serverNow() - (frames[1].at || 0)) / 100);
  const lerp = (a, b) => a + (b - a) * k;

  // Interpolate by ID. Matching by array index made every bullet inherit a different bullet's
  // previous position the moment one was spawned or spent, so shots visibly teleported sideways.
  const was = new Map();
  for (const o of prev.objects || []) if (o.id != null) was.set(o.id, o);

  const side = String(cur.edge ?? "");
  const hasLeft = side === "left" || side === "both";
  const hasRight = side === "right" || side === "both";
  const near = { left: 0, right: 0 };
  for (const o of cur.objects || []) {
    if (o.kind !== "bullet") continue;
    near.left = Math.max(near.left, clamp01(1 - o.x / 0.16));
    near.right = Math.max(near.right, clamp01(1 - (1 - o.x) / 0.16));
  }

  // ---- the edges: the seam between your phone and the next person's --------------------
  const nb = neighbours(cur.sub);
  const edge = (x0, w, glow, label, dir) => {
    const g = actx.createLinearGradient(dir > 0 ? x0 : x0 + w, 0, dir > 0 ? x0 + w : x0, 0);
    g.addColorStop(0, `rgba(255,255,255,${0.05 + glow * 0.34})`);
    g.addColorStop(1, "rgba(255,255,255,0)");
    actx.fillStyle = g;
    actx.fillRect(x0, 0, w, H);
    actx.fillStyle = `rgba(255,255,255,${0.24 + glow * 0.7})`;
    actx.fillRect(dir > 0 ? x0 : x0 + w - 3, 0, 3, H);
    if (!label) return;
    actx.save();
    actx.translate(dir > 0 ? 19 : W - 19, H / 2);
    actx.rotate(dir > 0 ? -Math.PI / 2 : Math.PI / 2);
    actx.fillStyle = `rgba(244,246,251,${0.4 + glow * 0.5})`;
    actx.font = "700 12px ui-sans-serif, system-ui";
    actx.textAlign = "center";
    actx.textBaseline = "middle";
    actx.fillText(label.toUpperCase(), 0, 0);
    actx.restore();
  };
  if (hasLeft) edge(0, W * 0.14, near.left, nb.left, 1);
  if (hasRight) edge(W * 0.86, W * 0.14, near.right, nb.right, -1);

  // ---- bullets ------------------------------------------------------------------------
  // A shot carries how many gaps it has crossed, and it visibly ages as it goes: bigger, hotter,
  // a longer tail, and once it has been the whole way round the ring it is white with a halo.
  // That is what makes the closed loop READABLE. The mode's best moment is your own shot arriving
  // back on your screen from the far side after crossing three other people's phones, and if it
  // looks like every other bullet then nobody in the room ever learns that the table wraps.
  const rings = Math.max(2, cur.seats || 2);
  for (const o of cur.objects || []) {
    const q = (o.id != null && was.get(o.id)) || o;
    const x = lerp(q.x, o.x) * W, y = lerp(q.y, o.y) * H;
    const hops = o.hops || 0;
    const age = clamp01(hops / Math.max(1, rings - 1));       // 0 = fresh, 1 = been all the way round
    const lapped = hops >= rings - 1;
    const r = (o.r || 0.03) * W * (1 + age * 0.85);
    const col = lapped ? "#ffffff" : hops > 0 ? "#ffc857" : (o.c || "#f4f6fb");
    const tx = (q.x - o.x) * W, ty = (q.y - o.y) * H;
    if (Math.hypot(tx, ty) > 0.5) {
      const len = 6 + age * 10;
      const g = actx.createLinearGradient(x, y, x + tx * len, y + ty * len);
      g.addColorStop(0, col);
      g.addColorStop(1, "transparent");
      actx.strokeStyle = g;
      actx.lineWidth = r * 1.5;
      actx.lineCap = "round";
      actx.beginPath();
      actx.moveTo(x, y);
      actx.lineTo(x + tx * len, y + ty * len);
      actx.stroke();
    }
    if (lapped) {                                             // it has been the whole way round
      actx.beginPath();
      actx.arc(x, y, r + 9, 0, 7);
      actx.strokeStyle = "#ffffff55";
      actx.lineWidth = 2;
      actx.stroke();
    }
    actx.beginPath();
    actx.arc(x, y, r, 0, 7);
    actx.fillStyle = col;
    actx.shadowColor = col;
    actx.shadowBlur = 14 + age * 24;
    actx.fill();
    actx.shadowBlur = 0;
  }

  // ---- your ship ----------------------------------------------------------------------
  // Losing a life used to be a pip quietly going out. On a phone held at arm's length by someone
  // watching other people, that is invisible — you find out you are dead, never that you were hit.
  if (cur.you && cur.you.hp !== lastHp) {
    if (lastHp != null && cur.you.hp < lastHp) hitAt = Date.now();
    lastHp = cur.you.hp;
  }
  const sinceHit = Date.now() - hitAt;
  if (sinceHit < 260) {
    const k2 = 1 - sinceHit / 260;
    actx.fillStyle = `rgba(255,90,78,${(0.42 * k2).toFixed(3)})`;
    actx.fillRect(0, 0, W, H);
    actx.strokeStyle = `rgba(255,255,255,${(0.9 * k2).toFixed(3)})`;
    actx.lineWidth = 10 * k2;
    actx.strokeRect(0, 0, W, H);
  }
  if (cur.you) {
    const x = cur.you.x * W, y = cur.you.y * H, r = 0.052 * W;
    // A tap that produces no immediate reaction reads as a dropped input, and the shot itself
    // does not appear until the next broadcast up to 50ms later. The flare is local and instant;
    // it says "your tap landed", not "a bullet exists", so it never lies about state.
    const sinceFire = Date.now() - firedAt;
    if (sinceFire < 140) {
      const k3 = 1 - sinceFire / 140;
      actx.beginPath();
      actx.arc(x, y, r + 16 * k3, 0, 7);
      actx.fillStyle = `rgba(255,200,87,${(0.4 * k3).toFixed(3)})`;
      actx.fill();
    }
    actx.beginPath();
    actx.arc(x, y, r, 0, 7);
    actx.fillStyle = "#ff7a3c";
    actx.shadowColor = "#ff7a3c";
    actx.shadowBlur = 26;
    actx.fill();
    actx.shadowBlur = 0;
    actx.beginPath();
    actx.arc(x, y, r + 5, 0, 7);
    actx.strokeStyle = "#ffffff66";
    actx.lineWidth = 2;
    actx.stroke();

    // Health, as pips. The hero is hidden in an arena, so this is the only place it can live —
    // and pips read from across a table where a number does not.
    const hp = Math.max(0, cur.you.hp | 0);
    const pipW = 26, gap = 7, total = hp * pipW + (hp - 1) * gap;
    for (let i = 0; i < hp; i++) {
      actx.fillStyle = hp > 1 ? "#8ef0b0" : "#ff5a4e";
      actx.fillRect(W / 2 - total / 2 + i * (pipW + gap), 46, pipW, 5);
    }
  }
}
arena.addEventListener("pointermove", (e) => {
  if (!down || play.classList.contains("arena-on") === false) return;
  ws?.send(JSON.stringify({ t: "act", a: "move", x: e.clientX / innerWidth, y: e.clientY / innerHeight }));
});

// ---- the one place a view turns into pixels -----------------------------------------
let everAlive = false, wasHolding = false, wasAlive = true, litNow = false, phaseWas = null;
// NOT `screen`: that shadows window.screen for this whole module, and screen.orientation.angle
// is exactly what the tilt code needs to read to stop beta and gamma trading places in landscape.
let onScreen = "join";

function show(next) {
  if (onScreen === next) return;
  onScreen = next;
  // The fixed chrome (scoreboard, ring names, notice) lives OUTSIDE #app so it can float over the
  // play screen. That means it does not participate in the lobby's grid and will happily print
  // itself across the lobby's heading — so the lobby has to be able to switch it off.
  document.body.dataset.screen = next;
  $("join").hidden = next !== "join";
  $("lobby").hidden = next !== "lobby";
  play.hidden = next !== "play";
}
function text(el, s) { if (el.textContent !== s) el.textContent = s; }

let scoreSig = "";
function drawScores() {
  const list = S.players || [];
  const mine = myId();
  const sig = list.map((p) => `${p.id}:${p.name}:${p.alive}:${p.score}`).join("|") + `/${mine}`;
  if (sig === scoreSig) return;
  scoreSig = sig;
  const box = $("scores");
  box.textContent = "";
  for (const p of list) {
    const el = document.createElement("span");
    el.className = `${p.alive ? "" : "out"}${p.id === mine ? " me" : ""}`.trim();
    el.textContent = p.name;                          // text, never markup
    if (p.score) {
      const i = document.createElement("i");
      i.textContent = ` ${p.score}`;
      el.append(i);
    }
    box.append(el);
  }
}
function fitBig() {
  const key = `${bigEl.textContent.length}|${innerWidth}|${getComputedStyle(app).getPropertyValue("--gutter")}`;
  if (fitBig.key === key) return;
  fitBig.key = key;
  bigEl.style.fontSize = "";
  if (!bigEl.textContent) return;
  const box = hero.clientWidth, w = bigEl.scrollWidth;
  if (box && w > box) {
    const base = parseFloat(getComputedStyle(bigEl).fontSize);
    bigEl.style.fontSize = `${Math.max(24, base * (box / w))}px`;
  }
}
function chip(shape, label, title) {
  // The shape always shows while there is a state to show — it is what a colourblind player reads
  // instead of the colour. The WORD only shows when it says something the title does not, because
  // the same sentence twice on one screen is one more thing competing for a one-second glance.
  const same = label && title && label.toUpperCase() === String(title).toUpperCase();
  chipEl.hidden = !label;
  shapeEl.className = `shape ${shape}`;
  text(chipText, same ? "" : (label || ""));
}

// How long this throw is in the air, learned from the first frame we see it rather than hardcoded
// against a server constant that is meant to be retuned between playtests.
let inboundAt = 0, inboundMs = 900;
function inboundSpan(at) {
  if (at !== inboundAt) { inboundAt = at; inboundMs = Math.max(200, at - serverNow()); }
  return inboundMs;
}

function paint() {
  if (!S) return show("join");

  const v = S.view || {};
  const alive = S.you ? S.you.alive : true;
  if (alive) everAlive = true;
  // A phone that joined mid-round is not alive, and every mode renders not-alive as OUT. Being
  // told you already lost, ten seconds after scanning the QR, is the worst first impression we
  // could hand a judge. If we have never once been alive, we did not lose — we just got here.
  const walkUp = !!S.you && !alive && !everAlive && S.phase !== "lobby";

  if (S.phase === "lobby" && !v.seatPicker && !v.lobby) show("play");
  else if (v.lobby || (S.phase === "lobby" && v.seatPicker)) show("lobby");
  else show("play");

  // Player names are typed by strangers at an expo and this used to go straight into innerHTML,
  // on every animation frame. Built as nodes now, with the name set as text — and only rebuilt
  // when it actually changed, rather than sixty times a second.
  drawScores();
  text($("notice"), S.phase === "live" ? "" : (S.notice || ""));

  if (onScreen === "lobby") {
    const blocked = v.seatNotice || "";
    text($("seatnotice"), blocked);
    $("seatnotice").hidden = !blocked;
    drawModes();
    placeSeats();
    drawRing(null);
    app.style.background = "var(--idle)";
    app.style.color = "var(--ink)";
    app.classList.remove("on-light");
    fuseEl.hidden = true;
    tone(0);
    return;
  }

  // ---- derive. Time-dependent fields are computed HERE, off the synced clock, never sent
  // pre-rendered: a waiting game produces no state changes and therefore no broadcasts.
  let big = v.big, title = v.title, sub = v.sub, bg = v.bg, ink = v.ink;
  let clock = "", urgency = 0, shape = "circle", label = "", pulsing = false, light = false;

  if (v.toneFrom && v.toneTo) urgency = clamp01((serverNow() - v.toneFrom) / (v.toneTo - v.toneFrom));

  if (v.countdownTo) {
    const secs = (Math.max(0, v.countdownTo - serverNow()) / 1000).toFixed(1);
    // Impostor sends BOTH your secret word and the 60s talk deadline. Letting the clock take the
    // hero slot meant every phone rendered the same "59.1" and nobody ever saw their word.
    if (big == null) big = secs; else clock = secs;
  }
  if (v.hot) {
    const mix = (a, b) => Math.round(a + (b - a) * urgency);
    bg = `rgb(${mix(108, 255)},${mix(38, 74)},${mix(22, 32)})`;
    shape = "diamond"; label = "you have it"; pulsing = true;
  }
  if (v.braced) { bg = "var(--brace)"; ink = "var(--brace-ink)"; shape = "triangle"; label = "braced"; }
  // Someone has you in their sights and your phone will not say who. This is the whole game, and
  // until now it differed from "nothing is happening" only by a line of small text.
  if (v.marked && !v.hot) {
    bg = "var(--marked)"; ink = "var(--marked-ink)";
    shape = "triangle"; label = "in the crosshairs"; pulsing = true;
  }
  // It is in the air, at you, and you have the length of the flight to face whoever threw it.
  if (v.incomingAt) {
    bg = "var(--inbound)"; ink = "var(--inbound-ink)";
    shape = "diamond"; label = "incoming"; pulsing = true; light = true;
  }
  if (v.flashAt) {
    const lit = serverNow() >= v.flashAt;
    big = lit ? v.litBig : v.waitBig;
    title = lit ? "" : v.waitTitle;
    sub = lit ? "" : v.waitSub;
    shape = lit ? "square" : "circle";
    label = lit ? "now" : "wait";
    if (lit) { bg = v.litBg || "var(--lit)"; ink = v.litInk || "var(--lit-ink)"; }
    if (lit && !litNow) buzz(35);
    litNow = lit;
  }
  if (walkUp) {
    big = ""; title = "YOU'RE IN NEXT ROUND"; sub = "you arrived mid-round \u2014 you are not out";
    bg = "var(--idle)"; ink = "var(--ink)"; shape = "circle"; label = "waiting";
  } else if (!alive) {
    bg = "var(--out)"; ink = "var(--out-ink)"; shape = "square"; label = "out";
  }
  if (S.phase === "over") {
    bg = "var(--win)"; ink = "var(--win-ink)"; shape = "diamond"; label = "winner";
    if (alive && everAlive) { big = "YOU WIN"; title = ""; }
  }

  // Whatever you happen to be holding when the round starts is neutral. Flat on the table and up
  // at your chest are both legitimate ways to hold a phone and they are sixty degrees apart.
  if (S.phase !== phaseWas) {
    if (S.phase === "live") recalibrate();
    phaseWas = S.phase;
  }
  // A phone that cannot tilt says so where you are already looking, and says it for as long as it
  // is true rather than flashing once and leaving you to guess.
  if (v.wantsTilt && !tilt?.live) sub = tiltNotice() || sub;
  // Mid-throw, the only thing worth saying is who is about to catch it.
  if (aiming) sub = `→ ${aiming}`;

  // ---- transitions worth a frame of animation
  const holding = !!v.hot;
  if (holding && !wasHolding) { play.classList.remove("punching"); void play.offsetWidth; play.classList.add("punching"); }
  wasHolding = holding;
  if (wasAlive && !alive && !walkUp) { app.classList.remove("cutting"); void app.offsetWidth; app.classList.add("cutting"); }
  wasAlive = alive || walkUp;

  // ---- write
  const arenaOn = v.kind === "arena";
  play.classList.toggle("arena-on", arenaOn);
  if (arenaOn) { feedArena(v); drawArena(); }

  app.style.background = bg || "var(--idle)";
  app.style.color = ink || "var(--ink)";
  app.classList.toggle("on-light", !!(v.flashAt && serverNow() >= v.flashAt) || S.phase === "over");
  // Floored at 340ms. The pulse used to bottom out at 180ms, which is 5.5 full cycles a second —
  // past WCAG 2.3.1's three-flashes-a-second limit, on a full-screen colour field, aimed at a
  // room of strangers one of whom may be photosensitive. Urgency past that point is carried by
  // colour and by the closing edge instead.
  app.style.setProperty("--pulse", `${Math.max(340, Math.round(720 - urgency * 380))}ms`);
  app.style.setProperty("--tense", `${(1 + urgency * 6).toFixed(1)}px`);

  chip(shape, label, title);
  // An em dash is what the server sends when your aim resolves to nobody — you are pointing into
  // the gap between two people. Rendered literally it is a white bar in the middle of a black
  // screen, which reads as a crash. It becomes a reticle that is visibly waiting.
  const noAim = !!v.wantsAim && (big === "\u2014" || big === "-" || big === "");
  if (noAim) big = "\u2219 \u2219 \u2219";
  bigEl.classList.toggle("noaim", noAim);
  text(bigEl, big ?? "");
  bigEl.hidden = !big;
  clockEl.hidden = !clock;
  text(clockEl, clock);
  text(titleEl, title || "");
  titleEl.hidden = !title;
  text(subEl, sub || "");
  subEl.hidden = !sub;
  hero.classList.toggle("pulsing", pulsing);
  fitBig();

  const ring = arenaOn ? null : v.ring;
  // 17vw each side is 128px of a 375px phone handed to 11px names, which squeezed the hero hard
  // enough that fitBig shrank a seven-letter name to 58px — a 6mm cap height, under what anyone
  // reads at arm's length. The ring names get a lane, not a third of the screen.
  app.style.setProperty("--gutter", ring?.length ? "clamp(34px, 9vw, 58px)" : "16px");
  drawRing(ring);

  fuseEl.hidden = !(v.tone && S.phase === "live");
  if (!fuseEl.hidden) fuseFill.style.transform = `scaleX(${1 - urgency})`;
  tone(v.tone ? Math.max(0.05, urgency) : 0);

  // The walls close in with the fuse. Colour alone never carries a state here, so this rides on
  // top of a shape and a word rather than replacing them.
  app.style.setProperty("--edge", (v.tone && S.phase === "live" ? urgency * urgency : 0).toFixed(3));

  // The flight, computed from its deadline against our own synced clock. The server sends when it
  // lands, never how long is left.
  const inbound = v.incomingAt && S.phase === "live";
  $("inbound").hidden = !inbound;
  if (inbound) {
    const left = clamp01((v.incomingAt - serverNow()) / Math.max(1, inboundSpan(v.incomingAt)));
    $("inboundFill").style.transform = `scaleX(${left})`;
  }

  // Holding it but still locked out of throwing it on.
  play.classList.toggle("locked", !!v.hot && v.throwable === false);
}
// Scheduling lives OUTSIDE paint, so a frame that never fires cannot queue another one.
function frame() { paint(); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
// A hidden tab fires no animation frames at all. On a phone in a pocket that is exactly right,
// but it also means a tab coming back from the background shows a stale screen until the next
// frame, and it makes this client impossible to verify in a headless browser. A slow timer
// covers both, and costs nothing while the page is actually on screen.
setInterval(() => { if (document.hidden) paint(); }, 200);

addEventListener("resize", () => { fitBig.key = null; ringSig = ""; placeSeats(); });
// The hero is sized by measuring it. Until the webfont arrives that measurement is of the
// fallback, and fitBig's memo key has no font in it — so on a slow venue connection the hero
// would keep its fallback-measured size for the life of the page. One reset when the real face
// lands fixes it for whatever the fallback happened to be.
document.fonts?.ready.then(() => { fitBig.key = null; });
addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  ac?.resume().catch(() => {});
  if (!ws || ws.readyState > 1) connect();
});

if ("wakeLock" in navigator) {
  const hold = () => navigator.wakeLock.request("screen").catch(() => {});
  hold();
  addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") hold(); });
}
</script>
</body>
</html>

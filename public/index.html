<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a0d14">
<title>Huddle</title>
<style>
  :root { --ink:#f2f5fa; --dim:#8d97ab; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; margin:0; overscroll-behavior:none; }
  body { background:#0a0d14; color:var(--ink); user-select:none;
         font:600 17px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
  /* touch-action does not inherit, so it has to sit on the elements that receive the gesture */
  #app, .ring, .scores, .notice { touch-action:none; }
  #app { position:fixed; inset:0; display:grid; place-items:center; padding:24px; text-align:center;
         transition:background .12s linear; }
  .big { font-size:clamp(56px,22vw,150px); line-height:.95; font-weight:800; letter-spacing:-.03em;
         font-variant-numeric:tabular-nums; }
  .title { font-size:19px; letter-spacing:.18em; text-transform:uppercase; margin-top:10px; }
  .sub { font-size:15px; font-weight:500; color:var(--dim); margin:8px auto 0; max-width:34ch; }
  .dim .big, .dim .title { color:var(--dim); }
  .pulse { animation:p .62s infinite alternate ease-in-out; }
  @keyframes p { from { transform:scale(1); } to { transform:scale(1.07); } }
  @media (prefers-reduced-motion:reduce) { .pulse { animation:none; } }
  .ring { position:fixed; inset:0; pointer-events:none; }
  .ring b { position:absolute; transform:translate(-50%,-50%); font-size:13px; font-weight:800;
            letter-spacing:.08em; color:#aab4c8; text-transform:uppercase; }
  input { font:600 20px ui-sans-serif,system-ui,sans-serif; padding:15px; border-radius:14px;
          border:1px solid #2b3345; background:#141a26; color:var(--ink); width:min(78vw,320px); text-align:center; }
  button { font:700 17px ui-sans-serif,system-ui,sans-serif; padding:15px 26px; border-radius:14px; border:0;
           background:var(--ink); color:#0a0d14; margin:6px 4px 0; }
  button.ghost { background:#1a2130; color:var(--ink); border:1px solid #2b3345; }
  button.on { background:#ffc857; color:#1a1405; }
  .modes { display:grid; gap:8px; margin:14px auto 4px; width:min(88vw,420px); }
  .modes button { width:100%; text-align:left; padding:13px 16px; }
  .modes small { display:block; font-weight:500; font-size:13px; opacity:.7; margin-top:3px; }
  .scores { position:fixed; top:0; left:0; right:0; padding:10px 14px; display:flex; gap:12px;
            justify-content:center; flex-wrap:wrap; font-size:12px; font-weight:700; letter-spacing:.1em;
            text-transform:uppercase; color:#7d879b; }
  .scores i { font-style:normal; opacity:.45; }
  .scores .out { opacity:.35; text-decoration:line-through; }
  .notice { position:fixed; bottom:0; left:0; right:0; padding:14px; text-align:center;
            font-size:14px; font-weight:600; color:var(--dim); }
  .reset { position:fixed; top:6px; right:8px; z-index:5; background:#161d2b; color:#7d879b;
           border:1px solid #2b3345; border-radius:999px; padding:7px 12px; margin:0;
           font-size:12px; font-weight:800; letter-spacing:.1em; }
  .warn { position:fixed; top:8px; left:50%; transform:translateX(-50%); background:#3a2a10; color:#ffc857;
          padding:5px 12px; border-radius:999px; font-size:12px; font-weight:700; letter-spacing:.08em; }
  .seatpad { display:block; margin:14px auto 4px; touch-action:none; }
  .seathint { font-size:13px; font-weight:600; color:var(--dim); min-height:19px; margin-bottom:4px; }
  .seathint.block { color:#ffc857; }
  button:disabled { opacity:.35; }
  .arena { position:fixed; inset:0; width:100%; height:100%; display:none; touch-action:none; z-index:2; }
  .arena.on { display:block; }
</style>

<button class="reset" id="reset" title="back to lobby">RESET</button>
<div id="app"></div>
<canvas class="arena" id="arena"></canvas>
<div class="ring" id="ring"></div>
<div class="scores" id="scores"></div>
<div class="notice" id="notice"></div>

<script type="module">
const $ = (id) => document.getElementById(id);
const app = $("app"), ringEl = $("ring");

// Identity survives a reload or a dropped socket, so a phone that locked comes back as the SAME
// player instead of a new dead one.
const store = window.sessionStorage;
const TOKEN = store.token || (store.token = (crypto.randomUUID?.() || String(Math.random()).slice(2)));

let ws = null, me = null, S = null, offset = 0, joined = false, name = store.name || "";
let ac = null, osc = null, gain = null, lastPong = Date.now(), dropped = false;
const offsets = [];
const serverNow = () => Date.now() + offset;

// ---- clock sync. Every timed thing on every phone is computed from this, which is why Flash can
// light up on all of them at the same instant without the server sending a frame. ----
const ping = () => ws?.readyState === 1 && ws.send(JSON.stringify({ t: "ping", c: Date.now() }));
function onPong(m) {
  lastPong = Date.now();
  offsets.push(m.s - (m.c + (Date.now() - m.c) / 2));
  offsets.sort((a, b) => a - b);
  offset = offsets[offsets.length >> 1];
  if (offsets.length > 24) offsets.shift();
}

function audioOn() {
  if (ac) return;
  ac = new (window.AudioContext || window.webkitAudioContext)();
  if (navigator.audioSession) try { navigator.audioSession.type = "playback"; } catch {}
  osc = ac.createOscillator(); gain = ac.createGain();
  gain.gain.value = 0; osc.type = "sawtooth"; osc.frequency.value = 120;
  osc.connect(gain); gain.connect(ac.destination); osc.start();
}
function tone(level) {
  if (!gain) return;
  if (ac.state !== "running") ac.resume().catch(() => {});
  gain.gain.setTargetAtTime(level > 0 ? 0.04 : 0, ac.currentTime, 0.07);
  if (level > 0) osc.frequency.setTargetAtTime(120 + level * 520, ac.currentTime, 0.12);
}
const buzz = (ms) => navigator.vibrate && navigator.vibrate(ms);

// ---- input ----
// Three different things want the pointer: the swipe/tap gestures every text mode is built on,
// the lobby seat picker, and Duel's arena. They cannot all listen on the window at once, so the
// renderer declares which one is live and the other two stay out of the way.
let inputMode = "gesture";
let down = null;
$("reset").addEventListener("pointerdown", (e) => e.stopPropagation());
$("reset").addEventListener("pointerup", (e) => e.stopPropagation());
$("reset").onclick = () => {
  ws?.send(JSON.stringify({ t: "reset" }));
  ws?.send(JSON.stringify({ t: "kickGhosts" }));
};
addEventListener("pointerdown", (e) => { if (inputMode === "gesture") down = { x: e.clientX, y: e.clientY }; });
addEventListener("pointercancel", () => { down = null; });
addEventListener("pointerup", (e) => {
  if (inputMode !== "gesture" || !down || !joined) return;
  const dx = e.clientX - down.x, dy = e.clientY - down.y, far = Math.hypot(dx, dy) > 38;
  down = null;
  if (far) { ws?.send(JSON.stringify({ t: "act", a: "swipe", angle: Math.atan2(dy, dx) })); buzz(18); }
  else ws?.send(JSON.stringify({ t: "act", a: "tap" }));
});

// ---- seats. The engine claims a swipe reaches the person actually sitting there, which is only
// true if people say where they are, so this is the one bit of client the claim depends on. ----
let seatDrag = false, seatSent = 0, mySeat = null, lastSeats = [], lobbyKey = "";

function wireSeatPad(pad) {
  const place = (e, force) => {
    const r = pad.getBoundingClientRect();
    mySeat = Math.atan2(e.clientY - (r.top + r.height / 2), e.clientX - (r.left + r.width / 2));
    paintSeats(lastSeats);
    const t = Date.now();
    if (!force && t - seatSent < 60) return;
    seatSent = t;
    ws?.send(JSON.stringify({ t: "seat", angle: mySeat }));
  };
  pad.addEventListener("pointerdown", (e) => {
    e.stopPropagation();
    seatDrag = true;
    pad.setPointerCapture(e.pointerId);
    place(e, true);
  });
  pad.addEventListener("pointermove", (e) => { if (seatDrag) place(e, false); });
  pad.addEventListener("pointerup", (e) => { if (seatDrag) { seatDrag = false; place(e, true); } });
  pad.addEventListener("pointercancel", () => { seatDrag = false; });
}

function paintSeats(seats) {
  lastSeats = seats || [];
  const c = $("seatpad");
  if (!c) return;
  const dpr = Math.min(devicePixelRatio || 1, 2), size = c.clientWidth || 230;
  if (c.width !== Math.floor(size * dpr)) { c.width = c.height = Math.floor(size * dpr); }
  const g = c.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, size, size);
  const cx = size / 2, cy = size / 2, r = size / 2 - 26;
  g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2);
  g.fillStyle = "#141a26"; g.fill();
  g.strokeStyle = "#252f43"; g.lineWidth = 2; g.stroke();
  g.textAlign = "center"; g.textBaseline = "middle";
  g.fillStyle = "#4a5470"; g.font = "700 10px ui-sans-serif,system-ui,sans-serif";
  g.fillText("THE TABLE", cx, cy);
  for (const s of lastSeats) {
    const angle = s.you ? (mySeat ?? (s.placed ? s.angle : -Math.PI / 2)) : s.angle;
    if (!s.placed && !s.you) continue;                 // they have not sat down yet
    const x = cx + Math.cos(angle) * r, y = cy + Math.sin(angle) * r;
    g.globalAlpha = s.placed || s.you ? 1 : 0.4;
    if (s.you && !s.placed) g.globalAlpha = 0.5;
    g.beginPath(); g.arc(x, y, s.you ? 12 : 9, 0, Math.PI * 2);
    g.fillStyle = s.you ? "#ffc857" : "#3dd68c"; g.fill();
    g.globalAlpha = 1;
    g.fillStyle = s.you ? "#ffc857" : "#8d97ab";
    g.font = "800 10px ui-sans-serif,system-ui,sans-serif";
    g.fillText(s.you ? "YOU" : s.name.slice(0, 8).toUpperCase(), x, y + (Math.sin(angle) >= 0 ? 22 : -22));
  }
}

// ---- the arena. Drag moves, tap fires: they have to be separate gestures or you shoot every
// time you reposition, which makes the game unplayable in about four seconds. ----
let arenaDown = null, arenaMoved = false, arenaSent = 0, myShip = { x: 0.5, y: 0.5 };
const arenaEl = $("arena");
const arenaPoint = (e) => ({
  x: Math.min(1, Math.max(0, e.clientX / innerWidth)),
  y: Math.min(1, Math.max(0, e.clientY / innerHeight)),
});
arenaEl.addEventListener("pointerdown", (e) => {
  e.stopPropagation();
  arenaDown = arenaPoint(e); arenaMoved = false;
  arenaEl.setPointerCapture(e.pointerId);
});
arenaEl.addEventListener("pointermove", (e) => {
  if (!arenaDown) return;
  const p = arenaPoint(e);
  if (!arenaMoved && Math.hypot((p.x - arenaDown.x) * innerWidth, (p.y - arenaDown.y) * innerHeight) > 12) arenaMoved = true;
  if (!arenaMoved) return;
  myShip = p;
  const t = Date.now();
  if (t - arenaSent < 45) return;
  arenaSent = t;
  ws?.send(JSON.stringify({ t: "act", a: "move", x: p.x, y: p.y }));
});
arenaEl.addEventListener("pointerup", (e) => {
  if (!arenaDown) return;
  const p = arenaPoint(e);
  arenaDown = null;
  if (arenaMoved) return ws?.send(JSON.stringify({ t: "act", a: "move", x: p.x, y: p.y }));
  ws?.send(JSON.stringify({ t: "act", a: "fire", dir: Math.atan2((p.y - myShip.y) * innerHeight, (p.x - myShip.x) * innerWidth) }));
  buzz(12);
});
arenaEl.addEventListener("pointercancel", () => { arenaDown = null; });

function drawArena(v) {
  const c = arenaEl, g = c.getContext("2d");
  const dpr = Math.min(devicePixelRatio || 1, 2), w = innerWidth, h = innerHeight;
  if (c.width !== Math.floor(w * dpr) || c.height !== Math.floor(h * dpr)) {
    c.width = Math.floor(w * dpr); c.height = Math.floor(h * dpr);
  }
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.fillStyle = "#070a12"; g.fillRect(0, 0, w, h);
  if (!arenaDown) myShip = v.you;

  // The edges with a neighbour behind them are the only way out of your screen, and the only way
  // in. Everything interesting happens in the dark between them.
  for (const side of ["left", "right"]) {
    if (v.edge !== side && v.edge !== "both") continue;
    const x0 = side === "left" ? 0 : w;
    const grad = g.createLinearGradient(x0, 0, side === "left" ? 30 : w - 30, 0);
    grad.addColorStop(0, "rgba(123,158,255,.42)");
    grad.addColorStop(1, "rgba(123,158,255,0)");
    g.fillStyle = grad;
    g.fillRect(side === "left" ? 0 : w - 30, 0, 30, h);
  }
  for (const o of v.objects || []) {
    g.beginPath(); g.arc(o.x * w, o.y * h, Math.max(4, o.r * Math.min(w, h)), 0, Math.PI * 2);
    g.fillStyle = o.c || "#ffffff"; g.fill();
  }
  const sx = v.you.x * w, sy = v.you.y * h;
  g.beginPath(); g.arc(sx, sy, 26, 0, Math.PI * 2);
  g.strokeStyle = "rgba(238,244,255,.25)"; g.lineWidth = 2; g.stroke();
  g.beginPath(); g.arc(sx, sy, 16, 0, Math.PI * 2);
  g.fillStyle = "#eef4ff"; g.fill();

  g.textAlign = "left"; g.textBaseline = "top";
  g.fillStyle = "#eef4ff"; g.font = "800 15px ui-sans-serif,system-ui,sans-serif";
  g.fillText(v.title || "", 16, 16);
  g.textAlign = "center"; g.textBaseline = "bottom";
  g.fillStyle = "#8d97ab"; g.font = "700 13px ui-sans-serif,system-ui,sans-serif";
  g.fillText(v.sub || "", w / 2, h - 34);
  g.fillStyle = "#4a5470"; g.font = "600 12px ui-sans-serif,system-ui,sans-serif";
  g.fillText("drag to move · tap to fire", w / 2, h - 14);
}

// ---- connection, with reconnect. iOS freezes sockets on screen lock and often never fires
// onclose, so silence on the ping/pong is the real signal. ----
function connect() {
  ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}`);
  ws.onopen = () => {
    dropped = false; lastPong = Date.now();
    for (let i = 0; i < 5; i++) setTimeout(ping, i * 110);
    if (name) ws.send(JSON.stringify({ t: "join", name, token: TOKEN }));
    render();
  };
  ws.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    if (m.t === "pong") return onPong(m);
    if (m.t === "hello") { me = m.id; joined = true; return; }
    if (m.t === "view") { S = m; render(); }
  };
  ws.onclose = () => { dropped = true; render(); setTimeout(connect, 700); };
  ws.onerror = () => ws.close();
}
setInterval(() => {
  ping();
  if (joined && Date.now() - lastPong > 9000 && ws?.readyState === 1) ws.close();
}, 3000);
connect();

function drawRing(ring) {
  ringEl.innerHTML = "";
  if (!ring || !ring.length) return;
  const cx = innerWidth / 2, cy = innerHeight / 2, r = Math.min(cx, cy) * 0.8;
  for (const p of ring) {
    const b = document.createElement("b");
    b.textContent = p.name;
    b.style.left = `${cx + Math.cos(p.angle) * r}px`;
    b.style.top = `${cy + Math.sin(p.angle) * r}px`;
    ringEl.append(b);
  }
}

function render() {
  document.querySelector(".warn")?.remove();
  if (dropped) {
    const w = document.createElement("div");
    w.className = "warn"; w.textContent = "RECONNECTING";
    document.body.append(w);
  }

  if (!S) {
    app.style.background = "#0a0d14";
    app.innerHTML = `<div><div class="big" style="font-size:46px">HUDDLE</div>
      <div class="sub">party games that live across everyone&rsquo;s phones</div>
      <div style="margin-top:18px"><input id="n" placeholder="your name" maxlength="12" autocomplete="off" value="${name}"></div>
      <button id="j">Join</button></div>`;
    $("j").onclick = () => {
      audioOn();
      name = store.name = ($("n").value || "player").slice(0, 12);
      ws?.send(JSON.stringify({ t: "join", name, token: TOKEN }));
    };
    $("n").onkeydown = (e) => { if (e.key === "Enter") $("j").click(); };
    return;
  }

  const v = S.view || {};
  // Time-derived fields are computed HERE, off the synced clock — never sent pre-rendered.
  let big = v.big, bg = v.bg, ink = v.ink, title = v.title, sub = v.sub, urgency = 0;
  if (v.countdownTo) {
    const left = Math.max(0, v.countdownTo - serverNow());
    big = (left / 1000).toFixed(1);
  }
  if (v.toneFrom && v.toneTo) urgency = Math.max(0, Math.min(1, (serverNow() - v.toneFrom) / (v.toneTo - v.toneFrom)));
  if (v.hot) bg = `rgb(${86 + urgency * 152},${36 - urgency * 26},42)`;
  if (v.flashAt) {
    const lit = serverNow() >= v.flashAt;
    big = lit ? v.litBig : v.waitBig;
    if (lit) { bg = v.litBg; ink = v.litInk; if (!render.lit) { buzz(35); render.lit = true; } }
    else render.lit = false;
    title = lit ? "" : v.waitTitle;
    sub = lit ? "" : v.waitSub;
  }
  if (v.braced) bg = "#122a1e";

  app.style.background = bg || "#0a0d14";
  app.style.color = ink || "#f2f5fa";
  tone(v.tone ? Math.max(0.05, urgency) : 0);

  $("scores").innerHTML = S.players.map((p) =>
    `<span class="${p.alive ? "" : "out"}">${p.name}${p.score ? ` <i>${p.score}</i>` : ""}</span>`).join("");
  $("notice").textContent = S.phase === "live" ? "" : (S.notice || "");

  if (v.lobby) return renderLobby(v, sub);

  if (v.kind === "arena") {
    inputMode = "arena";
    lobbyKey = "";
    app.innerHTML = "";
    drawRing(null);
    arenaEl.classList.add("on");
    drawArena(v);
    return;
  }

  inputMode = "gesture";
  lobbyKey = "";
  arenaEl.classList.remove("on");
  app.innerHTML = `<div class="${v.dim ? "dim" : ""}">
    ${big != null ? `<div class="big ${v.pulse ? "pulse" : ""}">${big}</div>` : ""}
    ${title ? `<div class="title">${title}</div>` : ""}
    ${sub ? `<div class="sub">${sub}</div>` : ""}</div>`;
  drawRing(v.ring);
}

function renderLobby(v, sub) {
  inputMode = "seat";
  drawRing(null);
  arenaEl.classList.remove("on");
  // Rebuilding this DOM under a finger that is mid-drag drops the pointer capture and the dot
  // snaps back to where the last broadcast put it. The live parts are updated in place instead.
  const key = `${S.mode}|${S.modes.map((m) => m.key).join(",")}`;
  if (key !== lobbyKey && !seatDrag) {
    app.innerHTML = `<div><div class="title">${S.modeName}</div><div class="sub" id="lobsub"></div>
      <canvas class="seatpad" id="seatpad" style="width:min(60vw,220px);height:min(60vw,220px)"></canvas>
      <div class="seathint" id="seatnote"></div>
      <div class="modes" id="modes">${S.modes.map((m) =>
        `<button class="ghost${m.key === S.mode ? " on" : ""}" data-k="${m.key}">${m.name}
          <small>${m.blurb} &middot; ${m.min}+ players</small></button>`).join("")}</div>
      <button id="go">Start ${S.modeName}</button></div>`;
    for (const b of $("modes").children) b.onclick = () => ws.send(JSON.stringify({ t: "start", mode: b.dataset.k }));
    $("go").onclick = () => ws.send(JSON.stringify({ t: "start", mode: S.mode }));
    wireSeatPad($("seatpad"));
    lobbyKey = key;
  }
  if (!$("seatpad")) return;
  const mine = (v.seats || []).find((s) => s.you);
  if (mine?.placed && !seatDrag) mySeat = mine.angle;
  $("lobsub").textContent = sub || "";
  $("seatnote").textContent = v.seatNotice || "everyone is seated";
  $("seatnote").classList.toggle("block", !!v.seatNotice);
  $("go").disabled = !!v.seatNotice;
  paintSeats(v.seats);
}

setInterval(() => { if (S && S.phase === "live") render(); }, 60);
addEventListener("resize", () => { if (S) render(); });
addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  ac?.resume().catch(() => {});
  if (!ws || ws.readyState > 1) connect();
});

if ("wakeLock" in navigator) {
  const hold = () => navigator.wakeLock.request("screen").catch(() => {});
  hold();
  addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") hold(); });
}
</script>
